- id: task-system
  config:
    databasePath: !!js "process.env.DSH_TASK_DATABASE || dshHomePath('task-system', 'tasks.sqlite')"
    nodeId: !!js "process.env.DSH_TASK_NODE_ID || 'local'"
    role: planner
    keepAlive: true
    maintenanceIntervalMs: 1000
    leaseTtlMs: 60000
    schedulerEnabled: true
    executionTools: []
# Role enforcement also exists in the ledger and native tool guard. Omit the
# default host's workload-facing tools from this planner composition.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-workflow
  disabled: true
