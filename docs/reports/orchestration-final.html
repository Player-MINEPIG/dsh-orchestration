<main><div class="kicker">2026-10-11 · PROJECT RUNTIME · TAILSCALE</div><h1>DSH × Codex<br>接回原任务面板</h1><p class="lead">递归派发与本地项目登记已迁移到 <code>codex/project-runtime</code> 的项目模型、官方插件入口和原有视觉样式。本报告取代上一轮独立 Dashboard 的交付结论。</p><p><span class="badge" id="verdict">真实联调通过 · 原面板验收通过</span></p>
<h2>这次修正了什么</h2><div class="grid"><article class="card"><h3>正确的代码基线</h3><p>从 <code>codex/project-runtime @ 1052d0d</code> 新建 <code>codex/project-runtime-integration</code> 和独立 worktree。保留原有项目会话、任务意图、候选路由、JEV 决策、执行会话协商与审核流程。</p></article><article class="card"><h3>原插件界面</h3><p>入口仍是 DSH 侧栏「项目与任务」，使用原来的 settings RPC、<code>project-page.html</code> 和样式。旧迁移加入的独立 Dashboard 界面已撤回。</p></article><article class="card"><h3>执行端也能看进度</h3><p>默认显示本机任务、递归派出的下级和必要父任务上下文；提供中央完整面板链接。数据由中央鉴权并裁剪，执行端读视图不获得中央修改权限。</p></article><article class="card"><h3>上报用 / 指令</h3><p>用户可直接执行 <code>/project</code>，无需先让模型调用工具。Agent 工具、命令和协议入口共享同一登记服务、幂等与回执规则。</p></article></div>
<h2>当前架构与数据归属</h2><div class="flow">VPS 中央任务账本<br>↓ Tailscale · 任务 / Run / 租约 / 父子关系<br>MBP DSH 执行器 → 官方 Subagent Provider → 本机 Codex<br>↑ 结果 / Attempt / Session / 实际模型证据<br>原 DSH「项目与任务」面板</div><p>中央只有一份任务与项目权威数据库：原 TaskLedger 与 <code>wb_*</code> 项目表一起承接正式派发和来源登记。MBP 的本地恢复记录、会话和 outbox 用于断线恢复，不能自行成为第二个调度权威。文件产物继续留在执行端；中央保存引用与可用性，不把未上传的本地文件表示为中央已拥有。</p><table><thead><tr><th>职责</th><th>实现与理由</th></tr></thead><tbody><tr><td>派发协议</td><td>插件提供 <code>task_delegate</code> 包装：固定父 Run、租约、权限继承及展示建议，再调用官方执行设施。官方生命周期不被另写的会话管理器替代。</td></tr><tr><td>递归展示</td><td>每个子任务保留真实 Task / Run / Attempt；独立交付显示任务卡，小步骤折叠在父 Run 内。显式选择优先，其次复杂度建议，默认保留任务条目。当前展示建议未额外触发 JEV 模型决策。</td></tr><tr><td>结果边界</td><td>执行成功、来源声称完成、中央审核通过分别记录。Codex 成功结果仍等待用户审核；父任务结算检查子树静止，避免派出去就声称整个项目完成。</td></tr><tr><td>可见范围</td><td>中央按已认证节点生成执行端快照。共享一个项目不会自动带出其他节点的无关兄弟任务。查看中央全部项目需要进入原有中央面板并使用其登录权限。</td></tr></tbody></table>
<h2>为什么插件不锁 CLI 版本</h2><p>CLI 安装、升级和选择属于执行端宿主。插件接收可选 <code>officialBackends[].cliPath</code>；未指定时使用官方 Provider 自带路径。版本号仅作为诊断证据记录，不是准入白名单，也没有仓库级强制 Codex 版本覆盖。</p><p>插件仍需验证它承诺的执行条件：实际模型和思考强度、权限策略、隔离模式以及允许的工具通道。不能满足时明确拒绝，不静默换模型。面板分别标明计划路线与同进程握手确认的模型，并显示产品线程和执行端运行时版本。</p>
<h2>本地项目如何接回中央</h2><pre>/project preview [packet.json]   校验与预览
/project register [packet.json]  项目开始时登记
/project sync [packet.json]      更新并重试待发送记录
/project submit [packet.json]    完成后提交
/project history [packet.json]   旧项目补录
/project status                 查看待发送与中央回执</pre><p>省略文件时读取当前会话目录的 <code>.dsh/project-registration.json</code>。协议为 <code>dsh.project-registration/v1</code>，包含来源命名空间、项目外部 ID、版本、幂等键、观察时间，以及任务、执行、报告与产物引用。普通命令不调用模型；历史材料需要先由 Agent 或转换器整理成协议文件，再预览提交。</p><p>早登记后可反复同步，结束时提交终态；也可在完成后一次提交，或把未遵循旧规范的历史资料整理后补录。实时指的是同步来源快照的能力，目前没有隐式扫描器或自动 Hook。其他 Harness 可以直接生成相同协议文件。</p><p>来源拥有原始事实，中央拥有独立分类与复核。历史项目没有租约、执行权或可执行 Run。未知原始时间保持未知；无法访问的文件只记录引用。离线提交保存 pending，收到中央回执才称为已确认；并发发送同一包最终收敛为同一回执。</p>
<h2>真实验收与打回重做</h2><div id="verification"><table><tr><th>验证</th><th>实测结果</th></tr><tr><td>VPS → MBP → 官方 Codex</td><td>9 个 Run 全部静止；8 次实际 Provider 调用（5 DSH、3 Codex），另一个任务在调用模型前取消。3 次官方握手均确认 gpt-6-luna / low，均收到 turn/completed。覆盖独立任务、小步骤、DSH → DSH → Codex 三级派发。</td></tr><tr><td>恢复与审核</td><td>人为丢失一次中央结果确认后恢复成功，没有重调 Provider；普通 DSH 产物存在。Codex 执行成功仍待人工审核，父任务诚实地部分结算，未代替用户批准。</td></tr><tr><td>来源项目上报</td><td>9 条原生命令、18 个命令生命周期事件、0 次模型调用；4 个来源项目落入同一个中央账本。17 条来源执行观察记录，没有生成执行 Attempt 或可执行 Run。PV 副本含 21 项任务、14 次来源执行、20 份报告、51 个产物引用。</td></tr><tr><td>原界面</td><td>实际操作两端官方 DSH 侧栏。MBP 默认本机只读进度，中央面板可查看完整项目。独立子任务显示卡片，小步骤折叠；展开与全屏后状态保留。执行依据展示真实模型、父 Run、Attempt 和产品线程。浏览器直接执行 preview 与 submit，收到中央幂等回执。</td></tr><tr><td>自动验证</td><td>完整 npm run check：807 项，802 通过、5 跳过、0 失败；分发验收通过。最终界面 9 项专项测试、命令反馈 2 项回归、5 类官方设置冒烟测试通过。</td></tr></table><p>根验收没有接受第一轮失败结果。修复同项目父子互斥死锁后重建隔离测试环境，重新跑完真实链路。原始证据汇总见 <a href="../validation/orchestration-final-20261011.json">验收 JSON</a>，复现入口为 <code>tests/dsh/runtime-live/</code>。</p><p>官方 rc.2 空会话会隐藏只有命令事件的聊天内容。最终接入公开 <code>command/executed</code> 事件与官方 Modal，仅为 /project 展示结果；未伪造聊天消息，未启动模型，也未修改官方安装。</p></div><details><summary>第一轮发现的问题及选择理由</summary><p>原项目运行时将同项目任务串行，递归父任务等待子任务时，子任务也被该互斥规则挡住。真实联调因此被判定不通过并保留失败账本；修复需同时处理后台发现、父子执行隔离与并发容量，不允许简单取消全部互斥。</p><p>Tailscale 有过首包超时后恢复的情况。两端路由、监听和防火墙检查正常；未改变网络规则。上报 pending 在连接恢复后以同一幂等包确认，没有重复登记。</p><p>原设置冒烟测试仍期待更早的字段集合。逐项对照 <code>1052d0d</code> 后更新陈旧断言，保留现有决策绑定与容量设置，而非回退产品代码。</p></details>
