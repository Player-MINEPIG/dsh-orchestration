name: Current product checks
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, promote]
        default: verify
        required: true
      candidate_sha:
        description: Exact dev commit to verify or promote
        type: string
        required: true
      verification_run_id:
        description: Successful verify run ID (promote only)
        type: string
      acceptance_summary:
        description: Short one-line acceptance summary for the version tag (promote only)
        type: string
      acceptance_record:
        description: Actual device scope, results and evidence; plain text (promote only)
        type: string
      user_confirmation:
        description: Actual user confirmation quote or evidence link (promote only)
        type: string
      confirm:
        description: Intended-device acceptance passed and user authorized this release (promote only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.operation == 'promote' && 'release-main' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ inputs.operation != 'promote' }}
defaults:
  run:
    shell: bash
env:
  TZ: UTC
  DSH_TELEMETRY_DISABLED: '1'
jobs:
  candidate:
    name: Candidate boundary
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: node scripts/ci/release-control.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  core:
    needs: candidate
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (inputs.operation == 'verify' && needs.candidate.result == 'success')) }}
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run build:fixtures
      - run: mkdir -p .runtime/ci-results
      - name: Release and PR safety contracts
        run: node --test tests/ci/*.test.mjs
      - name: Ledger, projects, workflows, schedules and remote protocol
        run: npm run test:core 2>&1 | tee .runtime/ci-results/core.log
      - name: JEV
        if: ${{ !cancelled() }}
        run: npm run test:jev 2>&1 | tee .runtime/ci-results/jev.log
      - name: Read-only dashboard
        if: ${{ !cancelled() }}
        run: npm run test:dashboard 2>&1 | tee .runtime/ci-results/dashboard.log
      - name: Shipped task packs
        if: ${{ !cancelled() }}
        run: npm run test:task-pack 2>&1 | tee .runtime/ci-results/task-pack.log
      - name: Management consumers
        if: ${{ !cancelled() }}
        run: npm run test:management 2>&1 | tee .runtime/ci-results/management.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ github.sha }}
          path: .runtime/ci-results
  native:
    needs: candidate
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (inputs.operation == 'verify' && needs.candidate.result == 'success')) }}
    name: Native DSH (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run build:fixtures
      - run: mkdir -p .runtime/ci-results
      - run: npm run setup:runtime -- --github-env
      - name: Real Loader, AgentLoop, host tools and recovery
        run: npm run test:native 2>&1 | tee .runtime/ci-results/native.log
      - name: Official permission, profile and RPC contracts
        if: ${{ !cancelled() }}
        run: npm run test:official 2>&1 | tee .runtime/ci-results/official.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ github.sha }}
          path: .runtime/ci-results
  ui:
    needs: candidate
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (inputs.operation == 'verify' && needs.candidate.result == 'success')) }}
    name: UI (${{ matrix.timezone }})
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: ${{ matrix.timezone }}
      DSH_BROWSER_OUTPUT: .runtime/ci-results/browser
      DSH_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run build:fixtures
      - run: mkdir -p .runtime/ci-results
      - name: Verify preinstalled Chrome
        run: |
          command -v google-chrome
          google-chrome --version | tee .runtime/ci-results/browser-version.txt
      - name: Settings codecs, role views, project pages and reminders
        run: npm run test:ui 2>&1 | tee .runtime/ci-results/ui.log
      - name: Real React settings, reminder actions and polling selection
        if: ${{ !cancelled() }}
        run: npm run test:browser 2>&1 | tee .runtime/ci-results/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ strategy.job-index }}-${{ github.sha }}
          path: .runtime/ci-results
  distribution:
    needs: candidate
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (inputs.operation == 'verify' && needs.candidate.result == 'success')) }}
    name: Installed packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: mkdir -p .runtime/ci-results
      - run: npm run setup:runtime
      - name: Install, boot and remove core packages with retained data
        run: npm run test:distribution 2>&1 | tee .runtime/ci-results/distribution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-${{ github.sha }}
          path: .runtime/ci-results

  full-ci:
    name: Full CI receipt
    needs: [candidate, core, native, ui, distribution]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: distribution-${{ github.sha }}
          path: .runtime/release-candidate
      - name: Bind tested packages to complete CI
        run: node scripts/ci/release-control.mjs manifest
        env:
          VERIFY_RESULTS: ${{ needs.candidate.result }},${{ needs.core.result }},${{ needs.native.result }},${{ needs.ui.result }},${{ needs.distribution.result }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/release-candidate
          if-no-files-found: error
          retention-days: 30
      - name: Record Full CI status
        if: always()
        run: node scripts/ci/release-control.mjs full-status
        env:
          FULL_RESULT: ${{ job.status }}

  promote:
    name: Promote release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'promote' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      statuses: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
      ACCEPTANCE_SUMMARY: ${{ inputs.acceptance_summary }}
      ACCEPTANCE_RECORD: ${{ inputs.acceptance_record }}
      USER_CONFIRMATION: ${{ inputs.user_confirmation }}
      RELEASE_CONFIRM: ${{ inputs.confirm }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Resolve immutable verification artifact
        id: receipt
        run: node scripts/ci/release-control.mjs resolve
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact_id }}
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
          path: .runtime/release-candidate
          merge-multiple: true
      - name: Generate detailed record and short tag text
        run: node scripts/ci/release-control.mjs record
      - name: Store the detailed record before approval or ref updates
        uses: actions/upload-artifact@v4
        id: release-record
        with:
          name: release-record-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/release-candidate/release-record.json
            .runtime/release-candidate/tag-message.txt
          if-no-files-found: error
          retention-days: 90
      - name: Validate stored artifact and atomically fast-forward main with version tag
        run: node scripts/ci/release-control.mjs promote
        env:
          UPLOADED_RECORD_ID: ${{ steps.release-record.outputs.artifact-id }}
          UPLOADED_RECORD_DIGEST: ${{ steps.release-record.outputs.artifact-digest }}
