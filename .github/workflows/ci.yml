name: Plugin conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:distribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ github.sha }}
          path: tests/dsh/results/*.json
