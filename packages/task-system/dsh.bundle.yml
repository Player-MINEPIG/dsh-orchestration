- insert:
    - id: task-system
      name: '@dsh-task/task-system/plugin'
      config:
        databasePath: !!js "process.env.DSH_TASK_DATABASE || dshHomePath('task-system', 'tasks.sqlite')"
        nodeId: !!js "process.env.DSH_TASK_NODE_ID || ''"
        role: !!js "process.env.DSH_TASK_ROLE || 'both'"
        keepAlive: true
        maintenanceIntervalMs: 1000
        leaseTtlMs: 60000
        schedulerEnabled: false
        autoExecute: false
        maxConcurrent: 1
        executionTools: null
    - id: task-system-settings
      name: '@dsh-task/task-system'
    - id: task-local-codex
      name: '@dsh-task/task-system/local-codex'
      config:
        enabled: false
        databasePath: !!js "dshHomePath('task-system', 'session-codex.sqlite')"
    - id: project-registration
      name: '@dsh-task/task-system/project-registration/plugin'
      config:
        namespaces: ['local']
