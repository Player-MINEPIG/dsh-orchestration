[data-status="review"],[data-status="warning"]{--state-color:var(--status-review)}

[data-status="done"],[data-status="success"],[data-status="online"],[data-status="enabled"]{--state-color:var(--status-done)}
[data-status="error"]{--state-color:var(--status-error)}

.timeline-row .circle.done{color:var(--status-done);border-color:var(--status-done);background:var(--soft)}.progress i{background:var(--status-running)}

const paths={projects:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',chat:'M21 11.5a8.4 8.4 0 0 1-8.7 8.5 10 10 0 0 1-4-.8L3 21l1.5-5a8.7 8.7 0 1 1 16.5-4.5Z',plus:'M12 5v14 M5 12h14',folder:'M3 6h6l2 2h10v12H3z M3 6V4h6l2 2',tasks:'M9 5h12 M9 12h12 M9 19h12 M3 5h2 M3 12h2 M3 19h2',settings:'M9 3h6l1 4 4 1v8l-4 1-1 4H9l-1-4-4-1V8l4-1z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',arrow:'M5 12h14 M12 5l7 7-7 7',back:'M19 12H5 M12 5l-7 7 7 7',close:'M6 6l12 12 M6 18 18 6',file:'M5 3h9l5 5v13H5z M14 3v6h5 M8 13h8 M8 17h6',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2 M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2',memory:'M4 7c0-5 16-5 16 0s-16 5-16 0v10c0 5 16 5 16 0V7 M4 12c0 5 16 5 16 0',handoff:'M3 7h12 M11 3l4 4-4 4 M21 17H9 M13 13l-4 4 4 4',search:'M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16 M16 16l6 6',plug:'M8 2v5 M16 2v5 M5 7h14v3a7 7 0 0 1-14 0z M12 17v5',more:'M5 12h.01 M12 12h.01 M19 12h.01',check:'M5 12l4 4L19 6',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M12 6v6l4 2'};
const icon=(name)=>`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[name]||paths.projects}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// randomUUID is secure-context-only; getRandomValues also works on trusted-network HTTP.
function requestId(){
 if(typeof crypto.randomUUID==='function')return crypto.randomUUID();
 if(typeof crypto.getRandomValues!=='function')throw Error('浏览器缺少安全随机数能力，无法创建请求标识');
 const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
 const hex=Array.from(bytes,value=>value.toString(16).padStart(2,'0')).join('');
 return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}
const initialProjects=[];
const initialTasks=[];
const variantInfo={A:{name:'对话优先',why:'项目卡片 → 统筹对话 → 按需展开任务；完整面板作为深入查看入口。',guide:'先点项目卡片，在对话中打开任务，再试“整理并继续”。'},B:{name:'项目工作台',why:'项目拥有概览、对话、任务、资料四个平级页面；完整面板融入项目。',guide:'从概览看下一步，切换“任务”审核，再回到“对话”。'},C:{name:'任务中心优先',why:'跨项目任务是首页；进入具体项目详情后查看关联节点，再开始项目对话。',guide:'先筛选任务，进入所属项目查看节点图，再开始对话；返回按钮回到任务中心。'}};
const variant='C';
let state={variant,projects:structuredClone(initialProjects),tasks:structuredClone(initialTasks),project:'p1',view:variant==='A'?'projects':variant==='B'?'workbench':'hub',tab:'overview',filter:'all',scope:'all',panelTab:'tasks',search:'',scopeOrigin:'hub',graphProject:null,hubFilter:'all',overlay:null,inspect:false,draft:'',handoffSelections:{done:true,constraints:true,next:true,active:true},last:'打开原型 · 示例数据'};
const project=id=>state.projects.find(p=>p.id===id)||{id:'unassigned',title:'临时任务',goal:'',messages:[],session:0},current=()=>state.temporaryConversation||project(state.project),task=id=>state.tasks.find(t=>t.id===id),tasksFor=id=>state.tasks.filter(t=>(t.delegationDisplay?.mode||t.delegationDisplay)!=='step'&&(!id||t.project===id||id==='temporary:'+t.id)),count=(rows,status)=>rows.filter(t=>t.status===status).length;
const labels={observed:'仅观察',inbox:'待派发',waiting:'等待后续处理',ready:'可执行',completed:'已完成',queued:'等待开始',running:'执行中',review:'待确认',done:'已完成',error:'需处理',online:'在线',enabled:'已启用',paused:'已暂停',current:'当前',archived:'已归档',stale:'离线 / 心跳过期',unknown:'尚未收到心跳',unavailable:'执行端关闭 / 未就绪',disabled:'已禁用',failed:'失败',blocked:'受阻',cancelled:'已取消',handled:'已处理',cancelling:'取消中',partial:'部分完成',uncertain:'结果不确定',succeeded:'执行成功'};
const runStatus=t=>t.runStatus,resultStatus=t=>t.resultStatus;
const badge=(status,label=labels[status])=>`<span class="badge ${status}" data-status="${status}"><span class="dot"></span>${esc(label)}</span>`;
function rail(){return `<aside class="rail" aria-label="DSH 导航"><div class="brand" aria-label="DeepSeek Harness">${MARK}</div><button data-action="new-chat" title="新会话" aria-label="新会话">${icon('chat')}</button><button data-action="home" class="selected" title="项目与任务" aria-label="项目与任务">${icon('projects')}</button><button data-action="plugins" title="插件" aria-label="插件">${icon('plug')}</button><button data-action="workspaces" title="工作区" aria-label="工作区">${icon('folder')}</button><button data-action="search" title="搜索项目" aria-label="搜索项目">${icon('search')}</button><span class="sample">交互原型 · 示例数据</span><div class="spacer"></div></aside>`}
function topbar(title,subtitle,actions=''){return `<header class="topbar"><div class="title-wrap"><h1>${title}</h1>${subtitle?`<small>${subtitle}</small>`:''}</div><div class="row">${actions}</div></header>`}
function backButton(fallback,label){return `<button class="icon-btn" data-action="nav-back" data-id="${fallback}" aria-label="${navigationHistory.length?'返回上一位置':label}">${icon('back')}</button>`;}
function headingProject(actions='',back='home'){const p=current(),label=back==='home'?'返回任务中心':'返回项目中心';return topbar(`<span class="project-list-link">${backButton(back,label)}<span>${esc(p.title)}</span></span>`,`${p.taskId?"临时任务规划":"项目"} · ${esc(p.stage)}`,actions)}
const readonlyActions=new Set(['create-schedule','create-schedule-confirm','schedule-control','schedule-control-confirm','create','create-temporary','create-confirm','create-temporary-confirm','chat','task-chat','task-status','task-retry','task-manual','task-cancel','task-restore','task-confirm-stopped','task-approve','task-accept','task-reject','handoff','history','project-menu']);
const isReadOnly=()=>state.records?.viewContext?.role==='executor';
const btn=(action,label,klass='outline',extra='')=>isReadOnly()&&readonlyActions.has(action)?'':`<button class="btn ${klass}" data-action="${action}" ${extra}>${label}</button>`;
function elapsedText(start,end){const seconds=Math.max(0,Math.floor(((end?Date.parse(end):Date.now())-Date.parse(start))/1000));if(!Number.isFinite(seconds))return '';const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),sec=seconds%60;return (h?h+'小时 ':'')+(h||m?m+'分 ':'')+sec+'秒';}
function elapsed(t){return t.executionStartedAt?`<small data-runtime-start="${esc(t.executionStartedAt)}" data-runtime-end="${esc(t.executionEndedAt||'')}">${t.executionEndedAt?'运行时长':'已运行'} ${elapsedText(t.executionStartedAt,t.executionEndedAt)}</small>`:'';}

function technical(kind,id,body,title='技术详情'){return `<details class="technical-details"${disclosureAttrs(kind,id??'record')}><summary>${esc(title)}</summary>${body}</details>`;}
function linkCard(action,id,title,summary=''){if(isReadOnly()&&readonlyActions.has(action))return '';return `<button class="link-card" data-action="${esc(action)}" data-id="${esc(id)}"><span class="link-copy"><strong>${esc(title)}</strong>${summary?`<span class="hint">${esc(summary)}</span>`:''}</span><span class="link-arrow" aria-hidden="true">${icon('arrow')}</span></button>`;}
function reportText(body){return String(body||'').split('\n').filter(line=>!/^\s*(?:(?:Run|Task|Session|Execution|Attempt)(?:\s+ID)?\s*[:：]?\s*)?(?:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}|[0-9a-f]{32,}|(?:run|task|session|exec|attempt)-[\w-]{20,})\s*$/i.test(line)).join('\n').trim();}
function readableReport(body,id){const text=reportText(body);return `<div class="report-markdown">${renderReportMarkdown(text||'报告只包含技术标识，展开原始报告查看。')}</div>${text!==String(body||'').trim()?technical('raw-report',id,`<div class="report-markdown">${renderReportMarkdown(body)}</div>`,'原始报告（含技术标识）'):''}`;}
function runsFor(id){return (state.records.runs||[]).filter(r=>r.taskId===id);}
function runTitle(r){return `第 ${Math.max(1,runsFor(r.taskId).findIndex(x=>runKey(x)===runKey(r))+1)} 次执行`;}
function runCard(r){const report=(state.records.reports||[]).filter(x=>x.runId===runKey(r)&&x.kind==='result').at(-1);return linkCard('schedule-run',runKey(r),`${runTitle(r)} · ${planTime(r.createdAt)}`,`${runResultLabel(r)}${r.node?' · '+r.node:''}${report?' · '+reportText(report.body).slice(0,100):''}`);}
function executionHistory(t){const runs=runsFor(t.id);return `<section class="detail-section"><h3>执行历史</h3><p class="hint">${runs.length} 次执行，分别保留输入、进度与结果。</p><div class="stack">${[...runs].reverse().map(runCard).join('')||'<p>尚未开始执行。</p>'}</div></section>`;}
function executionInput(r){const input=r?.inputSnapshot;if(!input)return '<section class="detail-section"><h3>本次执行输入</h3><p class="hint">这次执行未保存可展示的输入快照。</p></section>';return `<section class="detail-section"><h3>本次执行输入</h3><p class="hint">中央账本为这次执行保存的要求与附加上下文；执行器自行加载的 skill 和会话历史不包含在内。</p><h4>执行要求</h4><p class="record-body">${esc(input.description||'未记录')}</p>${input.goal?`<h4>执行目标</h4><p>${esc(input.goal)}</p>`:''}${r.retryPrompt?`<h4>本次补充要求</h4><p class="record-body">${esc(r.retryPrompt)}</p>`:''}<h4>项目上下文</h4>${input.project?`<p><strong>${esc(input.project.title)}</strong></p><p class="record-body">${esc(input.project.goal||input.project.description||'未提供项目说明')}</p>`:'<p class="hint">本次未附加项目上下文。</p>'}${input.criteria?.length?`<h4>本次验收要求</h4>${input.criteria.map(c=>`<p>${esc(c.description)}${c.requiredEvidence?' · 需要提供：'+esc(c.requiredEvidence):''}</p>`).join('')}`:''}${input.notes?.length?`<h4>附加材料</h4>${input.notes.map(n=>`<article><strong>${esc(n.title||'参考材料')}</strong>${readableReport(n.body,n.id)}</article>`).join('')}`:'<p class="hint">本次没有附加参考材料。</p>'}</section>`;}

function progressStatus(t){const p=t.progressRequest,active=t.runState==='running'||t.canRequestStatus;let summary=t.runState?runResultLabel({state:t.runState,reviewStatus:t.reviewStatus}):t.dispatchState==='inbox'?'等待可接单的执行端。':'尚未开始执行。';if(t.runState==='queued')summary=t.dispatchState==='inbox'?'正在等待可接单的执行端。':'已安排执行端，等待领取。';return `<section class="panel"><div class="spread wrap"><h3>执行进度</h3>${elapsed(t)}</div><p>${esc(summary)}</p>${p?.summary?`<h4>最近进度回报</h4><p class="record-body">${esc(p.summary)}</p><small>回报时间：${esc(planTime(p.reportedAt||p.requestedAt))}</small>`:active?`<p class="hint">${p?'已请求，等待执行端回报。':'尚无步骤回报，可查询执行端当前状态。'}</p>`:''}${t.canRequestStatus?btn('task-status',p&&!p.summary?'等待状态回报…':'刷新执行状态','outline','data-id="'+esc(t.id)+'"'+((p&&!p.summary)||state.statusSending===t.id?' disabled':'')):active&&isReadOnly()?'<p class="hint">使用“刷新进度”读取中央已收到的记录；主动查询请前往调度端。</p>':''}${active?'<p class="hint">状态查询读取执行端快照；与 agent 交流请进入任务对话。</p>':''}</section>`;}

function updateElapsed(){for(const el of document.querySelectorAll?.('[data-runtime-start]')||[])el.textContent=(el.dataset.runtimeEnd?'运行时长':'已运行')+' '+elapsedText(el.dataset.runtimeStart,el.dataset.runtimeEnd);}
function taskNodeLabel(t){return t.observationOnly&&(!t.node||t.node==='待选择执行端')?'来源执行（仅观察） · 来源未记录执行端':t.node;}
function provenanceHint(t){return t.kind==='scheduled'?'<small class="hint">周期任务 · 每次触发独立执行</small>':t.observationOnly?'<small class="hint">来源任务 · 中央复核独立记录</small>':t.parentTaskId?`<small class="hint">来自 ${esc(task(t.parentTaskId)?.title||'上级任务')} · 独立子任务</small>`:'';}
function taskRow(t){return `<button class="task-row" data-action="task" data-id="${t.id}"><span style="color:var(--muted)">${icon(t.status==='done'?'check':t.status==='running'?'clock':'tasks')}</span><div class="task-copy"><h3>${esc(t.title)}</h3>${provenanceHint(t)}<small>${esc(project(t.project).title)} · ${esc(taskNodeLabel(t))} · ${esc(planTime(t.time))}</small>${elapsed(t)}</div>${badge(t.status,t.stateLabel||labels[t.status])}<span class="entity-arrow" aria-hidden="true">${icon('arrow')}</span></button>`}
function taskInline(t){return `<button class="task-inline" data-action="task" data-id="${t.id}"><div class="spread">${badge(t.status,t.stateLabel||labels[t.status])}<small>${esc(taskNodeLabel(t))}</small></div><h3>${esc(t.title)}</h3>${provenanceHint(t)}<small class="report-preview">${esc(reportText(t.report).slice(0,160))}${reportText(t.report).length>160?'…':''}</small><span class="entity-arrow" aria-hidden="true">${icon('arrow')}</span></button>`}
function projectCollaborations(projectId){return (Array.isArray(state.records.projectCollaborations)?state.records.projectCollaborations:[]).filter(row=>row&&row.projectId===projectId);}
function collaborationStatus(row){return row.state==='pending_review'?'已提交 · 待复核':row.state==='active'?'已激活':'状态未记录';}
function projectBadge(p){const rows=projectCollaborations(p.id);if(!rows.length)return badge(projectStatus(p));const pending=rows.every(row=>row.state==='pending_review'),active=rows.some(row=>row.state==='active');return badge(pending?'review':active?'running':'observed','会话协作 · '+(pending?'待复核':active?'已激活':'状态未记录'));}
function collaborationSection(projectId){const rows=projectCollaborations(projectId);if(!rows.length)return '';return `<section class="panel project-collaboration" aria-label="会话协作"><h2>会话协作</h2>${rows.map(row=>`<article><div class="spread wrap"><h3>${esc(row.title||'当前会话协作')}</h3>${badge(row.state==='pending_review'?'review':row.state==='active'?'running':'observed',collaborationStatus(row))}</div>${row.goal?`<p class="record-body">${esc(row.goal)}</p>`:''}<dl class="kv"><dt>来源节点</dt><dd>${esc(row.ownerNodeId||'未记录')}</dd><dt>最近更新</dt><dd>${esc(planTime(row.updatedAt))}</dd></dl>${technical('collaboration',row.sessionId||projectId,`<p>来源会话：${esc(row.sessionId||'未记录')}</p><p>工作区：${esc(row.cwd||'未记录')}</p>`)}<h3>最近阶段摘要</h3><p class="record-body">${esc(row.summary||'尚未记录阶段摘要')}</p><p class="hint">中央尚未验收。${row.state==='pending_review'?'已提交会话进展，等待中央复核。':'当前会话已激活协作；执行进展与最终验收分别记录。'}</p></article>`).join('')}</section>`;}
function projectCard(p,action='project'){let rows=tasksFor(p.id);return `<button class="project-card ${action==='scope-select'&&state.scope===p.id?'scope-selected':''}" data-status="${projectStatus(p)}" data-action="${action}" data-id="${p.id}"><div class="spread"><span class="project-symbol">${icon('folder')}</span>${projectBadge(p)}</div><h2>${esc(p.title)}</h2><p>${esc(p.description)}</p><div class="summary-strip"><span class="status-text" data-status="running"><b>${count(rows,'running')}</b> 执行中</span><span class="status-text" data-status="review"><b>${count(rows,'review')}</b> 待确认</span>${projectCollaborations(p.id).length?'<span>当前会话协作 · 中央跟进</span>':state.records.projectRegistrations?.some(r=>r.projectId===p.id)?'<span>来源项目 · 已登记</span>':`<span>统筹会话 <b>${p.session}</b></span>`}</div><div class="next">下一步 · ${esc(p.next)}</div><span class="entity-arrow" aria-hidden="true">${icon('arrow')}</span></button>`}
function planById(id){return (state.records.schedules||[]).find(s=>s.scheduleId===id);}
function planTime(value,zone){if(!value||!Number.isFinite(Date.parse(value)))return '未记录';try{return new Date(value).toLocaleString('zh-CN',{...(zone?{timeZone:zone}:{}),hour12:false});}catch{return value;}}
function planCadence(s){if(s.intervalMs)return `每 ${s.intervalMs/60000} 分钟`;const daily=s.cron?.match(/^(\d+) (\d+) \* \* \*$/);return daily?`每天 ${daily[2].padStart(2,'0')}:${daily[1].padStart(2,'0')} · ${s.timeZone}`:`${s.cron||'未记录规则'} · ${s.timeZone}`;}
function planStatus(s){return s.retiredAt?'已停用':s.blocked?'任务已终止':s.enabled?'已启用':'已暂停';}
function planControls(s){return s.retiredAt||s.blocked?'':btn('schedule-control',s.enabled?'暂停计划':'恢复计划','outline','data-id="'+esc(s.scheduleId)+'"');}
function planCards(scope){const rows=(state.records.schedules||[]).filter(s=>!scope||scope==='all'||s.project===scope);return `<div class="stack">${rows.map(s=>`<section>${linkCard('schedule-detail',s.scheduleId,s.title,planStatus(s)+' · '+planCadence(s)+' · '+(s.project==='unassigned'?'独立计划':project(s.project).title))}<div class="row wrap plan-actions">${planControls(s)}</div></section>`).join('')||'<div class="empty">暂无定时计划。创建计划后，每次触发都会生成独立执行记录。</div>'}</div>`;}

function renderSchedules(){return topbar('<span class="project-list-link">'+backButton('projects','返回项目中心')+'定时计划</span>','管理触发规则；每次触发创建新的 Run',btn('create-schedule','新建定时计划','fill'))+`<section class="page"><div class="page-inner">${!isReadOnly()&&state.records.scheduleRuntime&&(!state.records.scheduleRuntime.enabled||!state.records.scheduleRuntime.ticking)?'<p class="notice">当前宿主没有启用自动调度，请在调度端任务系统设置中启用调度与保活；计划仍会保存。</p>':''}${scopeSelector()}<p class="hint">默认上次尚未结束时跳过本次；暂停不打断已触发的执行。计划启停与任务执行状态分别记录。</p>${planCards(state.scope)}</div></section>`;}
function renderScheduleDetail(){const s=planById(state.scheduleId);if(!s)return renderSchedules();const history=[...(s.occurrences||[])].reverse();return topbar('<span class="project-list-link">'+backButton('schedules-return','返回定时计划')+esc(s.title)+'</span>',planStatus(s)+' · '+planCadence(s),planControls(s))+`<section class="page"><div class="page-inner"><section class="panel"><h2>计划详情</h2><p>${esc(s.project==='unassigned'?'独立计划':project(s.project).title)} · ${esc(s.node)} · ${esc(s.model)}</p><p>${s.enabled&&!s.blocked&&!s.retiredAt?'下次触发 · '+esc(planTime(s.nextDueAt,s.timeZone)):'当前不再触发新执行'}</p><p class="hint">暂停不打断已触发的执行；恢复从下一个时间点开始。${s.overlap==='skip'?'上次未结束时跳过本次。':'重叠时按原计划排队。'}</p>${linkCard('task',s.taskId,'关联任务 · '+s.title,'查看任务要求与执行报告')}</section><h2>触发历史</h2><div class="stack">${history.map(o=>{const r=(state.records.runs||[]).find(r=>r.id===o.runId);return r?linkCard('schedule-run',runKey(r),runTitle(r)+' · '+planTime(o.scheduledFor,s.timeZone),runResultLabel(r)+' · 查看本次结果'):`<section class="panel"><h3>${esc(planTime(o.scheduledFor,s.timeZone))}</h3><p>${esc(({'skipped-overlap':'跳过 · 上次尚未结束','skipped-misfire':'跳过 · 错过触发时间',admitted:'已创建执行'})[o.status]||'触发状态未记录')}</p></section>`;}).join('')||'<p class="empty">尚未触发；到达计划时间后在这里记录每次执行。</p>'}</div></div></section>`;}
function scheduleForm(o){const d=o.draft,disabled=o.pending?'disabled':'';return dialog('新建定时计划','创建同一任务的周期执行计划',`<label class="form-field">计划名称<input data-plan="title" maxlength="500" value="${esc(d.title)}" ${disabled}></label><label class="form-field">任务要求<textarea data-plan="description" maxlength="20000" ${disabled}>${esc(d.description)}</textarea></label><label class="form-field">关联项目<select data-plan="projectId" ${disabled}><option value="">独立计划（不关联项目）</option>${o.options.projects.map(p=>`<option value="${esc(p.id)}" ${d.projectId===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label><label class="form-field">执行端与模型<select data-plan="routeId" ${disabled}>${o.options.routes.map(r=>`<option value="${esc(r.id)}" ${d.routeId===r.id?'selected':''}>${esc(r.label)}</option>`).join('')}</select></label>${!o.options.routes.length?'<p class="notice">尚无已授权且具备可用工作区的执行路线，请先连接执行端。</p>':''}<label class="form-field">触发方式<select data-plan="mode" ${disabled}><option value="interval" ${d.mode==='interval'?'selected':''}>固定间隔</option><option value="daily" ${d.mode==='daily'?'selected':''}>每天</option></select></label>${d.mode==='interval'?`<label class="form-field">间隔（分钟）<input data-plan="minutes" type="number" min="1" max="527040" value="${esc(d.minutes)}" ${disabled}></label><p class="hint">首次触发在创建成功后的一个间隔。</p>`:`<label class="form-field">每天时间<input data-plan="time" type="time" value="${esc(d.time)}" ${disabled}></label><label class="form-field">时区<input data-plan="timeZone" value="${esc(d.timeZone)}" placeholder="Australia/Melbourne" ${disabled}></label>`}<p class="hint">上次未结束时跳过本次；调度端短暂离线后最多补一次。暂停后恢复不补跑暂停期间。</p>`,btn('create-schedule-confirm',o.pending?'正在创建…':'创建计划','fill',o.pending||!o.options.routes.length?'disabled':''));}
function scheduleRunDetail(id){const r=(state.records.runs||[]).find(r=>runKey(r)===id);if(!r)return dialog('执行记录','', '<p>记录已不可用，请刷新。</p>','');const reports=(state.records.reports||[]).filter(report=>report.runId===id&&report.kind==='result');return drawer('本次执行结果',esc(task(r.taskId)?.title||'执行记录'),`<section class="detail-section"><h3>${esc(runTitle(r))}</h3><p>${esc(runResultLabel(r))}</p><p>开始于 ${esc(planTime(r.executionStartedAt||r.createdAt))}${r.executionEndedAt?' · 耗时 '+elapsedText(r.executionStartedAt||r.createdAt,r.executionEndedAt):''}</p><p>执行端：${esc(r.node||'未记录')} · 模型：${esc(r.actualModel||r.model||'未记录')}</p></section><section class="detail-section"><h3>执行报告</h3>${reports.map(report=>readableReport(report.body,report.id)).join('')||'<p class="hint">尚未提交本次结果。</p>'}</section>${executionInput(r)}<section class="detail-section"><h3>关联任务</h3>${linkCard('task',r.taskId,task(r.taskId)?.title||'查看任务','查看任务要求和其他执行记录')}</section>${runProof(r)}`);}

function updatePlanDraft(ev){if(!ev.target.dataset?.plan||state.overlay?.type!=='create-schedule')return;state.overlay.draft[ev.target.dataset.plan]=ev.target.value;if(ev.target.dataset.plan==='mode')renderOverlay();}

function renderProjects(){const ps=state.projects.filter(p=>!state.search||[p.title,p.description].some(x=>x.includes(state.search)));return topbar('项目中心','项目工作区与统筹会话',btn('home',icon('tasks')+' 任务','outline')+btn('create','新建项目','fill'))+`<section class="page"><div class="page-inner"><div class="intro"><div class="eyebrow">PROJECTS</div><h1>继续你的项目</h1><p>目标、任务和资料留在项目里，会话可以随着工作阶段更换。</p></div><div class="project-tools"><input class="search" id="project-search" placeholder="搜索项目" aria-label="搜索项目" value="${esc(state.search)}">${btn('fullpanel','完整面板','outline')}</div><div class="project-grid">${ps.map(p=>projectCard(p)).join('')||'<p class="empty">暂无项目，在设置 → 任务系统配置项目父目录后创建项目。</p>'}</div><section class="panel" style="margin-top:24px"><div class="spread"><div><h2>临时任务</h2><p>没有项目归属的任务，各自保留独立工作区与规划对话。</p><small>${tasksFor('unassigned').filter(t=>t.kind!=='scheduled').length} 项任务</small></div>${btn('temporary-tasks','进入临时任务区','outline')}</div></section><section class="panel" style="margin-top:18px"><div class="spread wrap"><div><h2>定时计划</h2><p>按固定间隔或每天触发，可关联项目，每次保留独立执行历史。</p><small>${(state.records.schedules||[]).length} 项计划</small></div>${btn('schedules','进入定时计划','outline')}</div></section></div></section>`;}
const REPLY_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 4-6 6 6 6M3 10h10a8 8 0 0 1 8 8v2"/></svg>';
function recipient(){return (state.executorTargets||[]).find(t=>t.sessionId===state.recipientSession);}
function renderMessages(p){return p.messages.map((m,i)=>{const direct=m.executor,caption=direct?`<div class="message-destination" title="${esc(m.sessionId||'')}">${REPLY_ICON}<span>${m.role==='user'?'发给':'回复来自'}执行端 · ${esc(direct)}</span></div>`:'',status=direct&&m.role==='user'?`<div class="direct-status">${esc(({queued:'等待执行端接收／回复',completed:'已回复',failed:'未能发送',uncertain:'回复未确认，请查看原会话'})[m.state]||'')}</div>`:'';return m.role==='user'?`<div class="message user" data-message-id="${esc(m.id||String(i))}">${caption}${esc(m.text)}${status}</div>`:`<div class="message" data-message-id="${esc(m.id||String(i))}">${caption||`<div class="assistant-label">${MARK}<span>${p.taskId?'临时任务规划':'项目统筹'} · 调度端</span></div>`}<p>${esc(m.text)}</p>${m.task&&task(m.task)?taskInline(task(m.task)):''}</div>`;}).join('')}
function recipientPicker(){return drawer('对话对象','直接选择消息接收者',`<button class="target-choice" data-action="recipient-select" data-id="">调度者<small>规划、派发和查询任务</small></button>${(state.executorTargets||[]).map(t=>`<button class="target-choice" data-action="recipient-select" data-id="${esc(t.sessionId)}">↪ 执行端 · ${esc(t.nodeId)}<small>${esc(t.title)}</small></button>`).join('')||'<p class="hint">任务尚未绑定执行端会话。</p>'}`);}

function conversationModelLabel(){const m=state.conversationModel?.effective;return m ? `${m.provider} / ${m.model}${m.reasoningEffort?' · '+m.reasoningEffort:''}`:'选择调度对话模型';}
const dismissedRecovery=new Set();
function recoveryKey(t){return JSON.stringify([t.id,t.runId||t.run,t.canReconcile,t.canRetry]);}
function recoveryControls(p){const ts=tasksFor(p.id).filter(t=>(t.canReconcile||t.canRetry)&&!dismissedRecovery.has(recoveryKey(t)));return ts.map(t=>`<section class="recovery-card"><div class="recovery-row"><strong title="${esc(t.title)}">${esc(t.title)}</strong>${btn(t.canReconcile?'task-confirm-stopped':'task-retry',t.canReconcile?'核实已停止':'重新尝试派发','recovery-action','data-id="'+esc(t.id)+'"')}<button class="icon-btn" data-action="dismiss-recovery" data-id="${esc(t.id)}" aria-label="关闭${esc(t.title)}提醒" title="仅关闭提示，任务仍保留">${icon('close')}</button></div><p>${t.canReconcile?'结果尚未确认；核实停止后可解除占用。':'重试可能重新执行工作；已有会话和报告保留。'}</p></section>`).join('');}

document.addEventListener('change',ev=>{updatePlanDraft(ev);if(ev.target.id==='project-scope'){state.scope=ev.target.value;if(state.scope!=='all')state.project=state.scope;state.filter='all';render()}});
document.addEventListener('change',ev=>{if(state.overlay?.type==='manual-confirm'&&ev.target.name==='manual-choice'){state.overlay.choice=ev.target.value;return;}if(state.overlay?.type!=='conversation-model')return;const o=state.overlay,providers=state.conversationModels.providers;if(ev.target.id==='conversation-provider'){const provider=providers.find(p=>p.id===ev.target.value);o.selection={provider:provider.id,model:provider.models[0]?.id??''};}else if(ev.target.id==='conversation-model'){o.selection={provider:o.selection.provider,model:ev.target.value};}else if(ev.target.id==='conversation-effort'){o.selection={...o.selection,reasoningEffort:ev.target.value||undefined};}else return;renderOverlay();});
document.addEventListener('submit',async ev=>{ev.preventDefault();if(ev.target.id==='temporary-form'){await actions('create-temporary-confirm');return;}if(ev.target.id!=='chat-form'||state.sending)return;const text=document.getElementById('message-input').value.trim();if(!text)return;state.sending=true;const commandId=state.sendCommand||(state.sendCommand=requestId());try{const target=recipient();if(state.pendingSend&&(state.pendingSend.owner!==current().id||state.pendingSend.input.text!==text))throw Error('上条消息的发送结果未确认，请回到原对话并用原消息重试');if(state.recipientSession&&!target)throw Error('原会话已变化，请重新选择对话对象');state.pendingSend??={owner:current().id,method:target?'sendExecutorMessage':current().taskId?'sendTaskMessage':'sendProjectMessage',input:target?{...(current().taskId?{}:{projectId:current().id}),taskId:target.taskId,nodeId:target.nodeId,sessionId:target.sessionId,commandId,text}:{...(current().taskId?{taskId:current().taskId}:{projectId:current().id}),commandId,text}};await api(state.pendingSend.method,state.pendingSend.input);state.pendingSend=null;state.sendCommand=null;state.draft='';const input=document.getElementById('message-input');if(input)input.value='';await loadConversation();updateConversation();const messages=document.querySelector('#messages');if(messages)messages.scrollTop=messages.scrollHeight;}catch(error){notify(error.message,'error');}finally{state.sending=false;}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeOverlay();});
window.addEventListener('resize',()=>{if(state.view==='project-detail')render()});
state.loaded=false;state.loadError=null;state.loadedAt=null;state.records={};state.settings={root:null,revision:0};state.turns=[];state.sessions=[];
const requests=new Map();
function api(method,input){return new Promise((resolve,reject)=>{const id=requestId(),timer=setTimeout(()=>{requests.delete(id);reject(Error('连接超时，请重试；已提交的操作会按原 ID 核对'))},45000);requests.set(id,{resolve,reject,timer});parent.postMessage({channel:'dsh-project-runtime',id,method,input},'*');});}
window.addEventListener('message',ev=>{if(ev.source!==parent||ev.data?.channel!=='dsh-project-runtime')return;if(ev.data.method==='theme'){if(['light','dark'].includes(ev.data.input))document.documentElement.dataset.theme=ev.data.input;return;}const call=requests.get(ev.data.id);if(!call)return;clearTimeout(call.timer);requests.delete(ev.data.id);ev.data.error?call.reject(Object.assign(Error(ev.data.error),{code:ev.data.errorCode})):call.resolve(ev.data.value);});
async function loadConversation(){const p=current();if(!p.canChat)return;const key=p.id+':'+p.session;const data=await api(p.taskId?'taskConversation':'projectConversation',p.taskId?{taskId:p.taskId}:{projectId:p.id});if(current().id+':'+current().session!==key)return;current().messages=data.messages;state.turns=data.turns;state.sessions=data.sessions;state.conversationModel=data.conversationModel;state.executorTargets=data.executorTargets||[];if(state.recipientOwner!==p.id){state.recipientOwner=p.id;state.recipientSession=null;}}
async function refresh(){const data=await api('projectSnapshot');for(const p of data.projects)p.messages=state.projects.find(old=>old.id===p.id)?.messages||[];state.projects=data.projects;state.tasks=[...data.tasks].sort((a,b)=>(Date.parse(b.time)||0)-(Date.parse(a.time)||0));state.settings=data.settings;state.records=data;state.loaded=true;state.loadError=null;state.loadedAt=new Date().toLocaleTimeString();}
function renderLoadState(){
 const error=state.loadError,role=error?.code==='PLANNER_REQUIRED';
 return topbar('项目与任务',role?'当前宿主 · 执行端':'项目服务')+`<section class="page"><div class="page-inner"><section class="panel" role="${error?'alert':'status'}" aria-live="polite"><h2>${role?'当前节点是执行端':error?'项目任务中心暂不可用':'正在读取项目与任务…'}</h2>${error?`<p>${esc(error.message)}</p>${role?'<p class="hint">请打开调度端 DSH 的“项目与任务”页面，创建项目、发起任务或查看全局进度。本机接收并执行派来的任务；本机队列与调度端连接可在“设置 → 任务系统”查看。</p>':'<p class="hint">数据尚未读取成功，无法显示任务数量。</p>'}<div class="row wrap">${btn('reload',role?'重新检查角色':'重新加载','outline')}</div>`:'<p class="hint">读取完成后显示项目和任务状态。</p>'}</section></div></section>`;
}
function renderLoadNotice(){return `<section class="panel" role="alert"><p>${esc(state.loadError.message)} 保留上次 ${esc(state.loadedAt)} 读取的数据，当前状态可能已变化。</p>${btn('reload','重新加载','outline')}</section>`;}
let refreshing=false,last='';async function poll(){
 if(refreshing||state.loadError?.code==='PLANNER_REQUIRED')return;
 refreshing=true;
 try{
  const recovering=!!state.loadError;
  await refresh();if(state.view==='conversation')await loadConversation();
  const fingerprint=JSON.stringify([state.projects,state.tasks,state.turns,state.records.nodes,state.records.schedules,state.records.runs,state.records.attempts,state.records.projectRegistrations,state.records.projectCollaborations,state.records.viewContext,state.conversationModel]);
  if(state.view==='conversation'){updateConversation();if(['task','schedule-run'].includes(state.overlay?.type))renderOverlay();last=fingerprint;}else if(recovering||fingerprint!==last){last=fingerprint;if(!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!state.overlay)render();else if(['task','schedule-run'].includes(state.overlay?.type))renderOverlay();}
 }catch(error){const changed=state.loadError?.message!==error.message||state.loadError?.code!==error.code;state.loadError={message:error.message,code:error.code};if(changed){if(state.view==='conversation')notify(error.message||'连接暂时中断','error');else render();}}
 finally{refreshing=false;}
}
render();poll();setInterval(poll,3000);setInterval(updateElapsed,1000);
</script>
</body></html>
