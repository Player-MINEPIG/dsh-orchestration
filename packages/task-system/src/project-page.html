.scope-selected{border-color:var(--state-color,var(--accent))!important;box-shadow:inset 0 0 0 1px var(--state-color,var(--accent))}
.graph-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.graph-heading h2{font-size:20px}.graph-heading p{margin-top:8px}

.graph-legend span{display:flex;align-items:center;gap:6px}.graph-legend i{display:inline-block;width:13px;height:13px;border:2px solid var(--muted);border-radius:4px}

.graph-canvas{position:relative;min-width:100%}.graph-edges{position:absolute;inset:0;pointer-events:none}.graph-edges>path{fill:none;stroke:var(--graph-edge);stroke-width:1.5}.graph-edges>path.dependency{stroke-dasharray:5 5;stroke:var(--graph-dependency)}

[data-status="running"],[data-status="info"],[data-status="current"]{--state-color:var(--status-running)}
[data-status="review"],[data-status="warning"]{--state-color:var(--status-review)}
[data-status="queued"],[data-status="paused"],[data-status="archived"],[data-status="handled"],[data-status="cancelled"],[data-status="cancelling"]{--state-color:var(--status-queued)}
[data-status="accepted"],[data-status="done"],[data-status="success"],[data-status="online"],[data-status="enabled"]{--state-color:var(--status-done)}
[data-status="error"]{--state-color:var(--status-error)}
.badge[data-status],.status-text,.kanban-title[data-status],.graph-state,.graph-legend [data-status],.hub-stats button[data-status],.metric[data-status] small,.metric[data-status] strong{color:var(--state-color)}
.hub-stats button.active,.filter-chip[data-status].active{border-color:var(--state-color);box-shadow:inset 0 0 0 1px var(--state-color);background:var(--raised)}
.filter-chip[data-status]{color:var(--state-color)}
.graph-legend i{border-color:var(--state-color)}.graph-legend [data-status="queued"] i{border-style:dashed}
.graph-node{position:absolute;display:flex;flex-direction:column;text-align:left;background:transparent;border:0;border-radius:0;padding:12px 15px;gap:6px;min-width:0}
.graph-node:hover{background:transparent}.node-shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;fill:var(--graph-node);stroke:var(--state-color);stroke-width:2}
.node-shape *{vector-effect:non-scaling-stroke}.graph-node:hover .node-shape{fill:var(--hover)}
.graph-node[data-status="queued"] .node-shape{stroke-dasharray:5 4}
.graph-node>*:not(.node-shape){position:relative}.graph-node[data-kind="项目"]{padding-inline:23px}.graph-node[data-kind="执行"]{padding-inline:22px}.graph-node[data-kind="产物"]{padding-right:20px}
.graph-node:focus-visible{outline-offset:4px;border-radius:10px}.shape-legend{gap:20px}.shape-legend .shape-symbol{position:relative;width:32px;height:22px;display:inline-block;--state-color:var(--muted)}
.shape-legend .node-shape{stroke-width:1.5;fill:var(--graph-node)}.project-detail-summary{margin-bottom:24px}.project-detail-summary .row{margin-top:16px}.project-detail-summary p{font-size:13px;color:var(--muted);margin-top:12px}
.timeline-row .circle.done{color:var(--status-done);border-color:var(--status-done);background:var(--soft)}.progress i{background:var(--status-running)}
.notice{color:var(--status-running);border-color:var(--status-running);background:var(--soft)}.notice.neutral{color:var(--status-queued);border-color:var(--line)}
.notice[data-status]{color:var(--state-color);border-color:var(--state-color)}
.toast[data-status]{color:var(--state-color);border-color:var(--state-color);background:var(--soft)}.context-meter i{background:var(--status-running)}
@media(max-width:760px){.graph-node{padding-block:11px;gap:5px}.graph-node[data-kind="执行"]{padding-inline:16px}.graph-node[data-kind="项目"]{padding-inline:20px}.graph-node-kind{flex-wrap:wrap;gap:3px}.shape-legend{gap:12px}}

const historyPages=new Map(),historyFilters=new Map(),historyPageSize=5;
function taskHistoryPage(id){const runs=[...runsFor(id)].reverse(),pages=Math.max(1,Math.ceil(runs.length/historyPageSize)),page=Math.min(historyPages.get(id)||0,pages-1);historyPages.set(id,page);return {runs: runs.slice(page*historyPageSize,(page+1)*historyPageSize),total:runs.length,page,pages};}
function executionHistory(t){const h=taskHistoryPage(t.id),attention=historyFilters.get(t.id)==='attention';return `<section class="detail-section execution-history" data-history-task="${esc(t.id)}"><h3>执行历史</h3><div class="row wrap">${['all','attention'].map(filter=>btn('history-filter',filter==='all'?'全部执行':'待核对',attention===(filter==='attention')?'fill':'outline','data-id="'+esc(JSON.stringify({taskId:t.id,filter}))+'" aria-pressed="'+(attention===(filter==='attention'))+'"')).join('')}</div>${attention?childAttentionSection(t)||'<p class="hint">暂无待核对的历史执行。</p>':`<p class="hint">共 ${h.total} 次执行，打开某次记录查看报告、流程、子任务与诊断。${h.pages>1?`每页 ${historyPageSize} 次，当前第 ${h.page+1} / ${h.pages} 页。`:''}</p><div class="stack">${h.runs.map(r=>runCard(r,'',false)).join('')||'<p>尚无执行记录。</p>'}</div>${legacyWorkflowHistory(t)}${h.pages>1?`<div class="row wrap" style="margin-top:12px">${btn('history-newer','较新执行','outline','data-id="'+esc(t.id)+'"'+(h.page===0?' disabled':''))}${btn('history-older','更早执行','outline','data-id="'+esc(t.id)+'"'+(h.page===h.pages-1?' disabled':''))}</div>`:''}`}</section>`;}
function scrollToHistory(id){const el=Array.from(document.querySelectorAll?.('#overlays [data-history-task]')||[]).find(el=>el.dataset.historyTask===id);el?.scrollIntoView?.({behavior:'smooth',block:'start'});}
function attentionSummary(t){const h=attentionPage(t);return h.total?`<section class="detail-section attention-summary"><h3>历史执行待核对</h3><p>${h.groups.length?'涉及 '+h.groups.length+' 次执行，':''}共 ${h.total} 项来源缺口或异常。后续成功不代表旧结果已解决。</p>${btn('attention-open','查看待核对执行','outline','data-id="'+esc(t.id)+'"')}</section>`:'';}

function executionInput(r){const input=r?.inputSnapshot;if(!input)return '<details class="detail-section requirement-disclosure"><summary>本次执行输入</summary><p class="hint">这次执行未保存输入快照。</p></details>';const same=input.description===task(r.taskId)?.description;return `<details class="detail-section requirement-disclosure"${disclosureAttrs('execution-input',runKey(r))}><summary>本次执行输入 <span class="hint">${same?'沿用任务要求':'含当次要求快照'}</span></summary><p class="hint">启动时保存的要求快照，不代表额外要求。仅本次补充要求、项目上下文和附加材料属于补充输入。</p>${same?'<p>与当前任务要求一致，不重复展示。</p>':`<h4>当次任务要求（历史快照）</h4><p class="record-body">${esc(input.description||'未记录')}</p>`}${input.goal?`<h4>执行目标</h4><p>${esc(input.goal)}</p>`:''}${r.retryPrompt?`<h4>本次补充要求</h4><p class="record-body">${esc(r.retryPrompt)}</p>`:''}<h4>项目上下文</h4>${input.project?`<p><strong>${esc(input.project.title)}</strong></p><p class="record-body">${esc(input.project.goal||input.project.description||'未提供项目说明')}</p>`:'<p class="hint">本次未附加项目上下文。</p>'}${input.criteria?.length?`<h4>本次验收要求</h4>${input.criteria.map(c=>`<p>${esc(c.description)}${c.requiredEvidence?' · 需要提供：'+esc(c.requiredEvidence):''}</p>`).join('')}`:''}</details>`;}
function executionResult(r,reports=[]){if(reports.length)return reports.map(report=>readableReport(report.body,report.id)).join('');const rejected=r?.settlementSummary?.includes('Native result rejected:');return `<p>${rejected?'结果提交未通过校验，尚无可验收的正式报告。':r?.state==='running'?'仍在执行，尚未提交正式报告。':'尚未收到本次正式结果报告，不能据此确认完成。'}</p>${r?.diagnosticReport?'<p class="notice neutral">已保留诊断与执行材料，可在溯源与技术细节中查看。</p>':''}`;}
function executionDiagnostics(r){if(!r)return '';const diagnostic=r.diagnosticReport;return diagnostic||r.settlementSummary?technical('diagnostics',runKey(r),`${r.settlementSummary?`<p class="record-body">${esc(r.settlementSummary)}</p>`:''}${diagnostic?readableReport(diagnostic.body,diagnostic.id):''}`,'诊断与校验详情'):'';}
function executionSupplement(r){const notes=r?.inputSnapshot?.notes||[];return notes.length?`<details class="detail-section"${disclosureAttrs('supplement',runKey(r))}><summary>附加参考材料</summary>${notes.map(n=>`<article><h4>${esc(n.title||'参考材料')}</h4>${readableReport(n.body,n.id)}</article>`).join('')}</details>`:'';}



function progressStatus(t){const p=t.progressRequest,active=t.runState==='running'||t.canRequestStatus;let summary=t.runState?runResultLabel({state:t.runState,reviewStatus:t.reviewStatus}):t.dispatchState==='inbox'?'等待可接单的执行端。':'尚未开始执行。';if(t.runState==='queued')summary=t.dispatchState==='inbox'?'正在等待可接单的执行端。':'已安排执行端，等待领取。';return `<section class="panel"><div class="spread wrap"><h3>执行进度</h3>${elapsed(t)}</div><p>${esc(summary)}</p>${t.kind==='scheduled'&&runsFor(t.id).some(r=>r.state==='uncertain')?'<p class="notice neutral">后续定时执行被未收尾的旧执行阻塞。核实执行端已停止后，使用“确认执行已停止”收尾；普通待验收不会阻塞下一次触发。收尾后调度器可能补触发当前到期计划。</p>':''}${p?.summary?`<h4>最近进度回报</h4><p class="record-body">${esc(p.summary)}</p><small>回报时间：${esc(planTime(p.reportedAt||p.requestedAt))}</small>`:active?`<p class="hint">${p?'已请求，等待执行端回报。':'尚无步骤回报，可查询执行端当前状态。'}</p>`:''}${t.canRequestStatus?btn('task-status',p&&!p.summary?'等待状态回报…':'刷新执行状态','outline','data-id="'+esc(t.id)+'"'+((p&&!p.summary)||state.statusSending===t.id?' disabled':'')):active&&isReadOnly()?'<p class="hint">使用“刷新进度”读取中央已收到的记录；主动查询请前往调度端。</p>':''}${active?'<p class="hint">状态查询读取执行端快照；与 agent 交流请进入任务对话。</p>':''}</section>`;}

function updateElapsed(){for(const el of document.querySelectorAll?.('[data-runtime-start]')||[])el.textContent=(el.dataset.runtimeEnd?'运行时长':'已运行')+' '+elapsedText(el.dataset.runtimeStart,el.dataset.runtimeEnd);}
function taskNodeLabel(t){if(t.workflowBinding)return '按流程阶段执行';return t.observationOnly&&(!t.node||t.node==='待选择执行端')?'来源执行（仅观察） · 来源未记录执行端':t.node;}
function provenanceHint(t){return t.kind==='scheduled'?'<small class="hint">周期任务 · 每次触发独立执行</small>':t.observationOnly?'<small class="hint">来源任务 · 中央复核独立记录</small>':t.parentTaskId?`<small class="hint">来自 ${esc(task(t.parentTaskId)?.title||'上级任务')} · 独立子任务</small>`:'';}
function taskRow(t){return `<button class="task-row" data-action="task" data-id="${t.id}"><span style="color:var(--muted)">${icon(['done','accepted'].includes(t.status)?'check':t.status==='running'?'clock':'tasks')}</span><div class="task-copy"><h3>${esc(t.title)}</h3>${provenanceHint(t)}<small>${esc(project(t.project).title)} · ${esc(taskNodeLabel(t))} · ${esc(planTime(t.time))}</small>${elapsed(t)}</div>${badge(t.status,t.stateLabel||labels[t.status])}<span class="entity-arrow" aria-hidden="true">${icon('arrow')}</span></button>`}
function taskInline(t){return `<button class="task-inline" data-action="task" data-id="${t.id}"><div class="spread">${badge(t.status,t.stateLabel||labels[t.status])}<small>${esc(taskNodeLabel(t))}</small></div><h3>${esc(t.title)}</h3>${provenanceHint(t)}<small class="report-preview">${esc(reportText(t.report).slice(0,160))}${reportText(t.report).length>160?'…':''}</small><span class="entity-arrow" aria-hidden="true">${icon('arrow')}</span></button>`}
function projectCollaborations(projectId){return (Array.isArray(state.records.projectCollaborations)?state.records.projectCollaborations:[]).filter(row=>row&&row.projectId===projectId);}
function collaborationStatus(row){return row.state==='pending_review'?'已提交 · 待复核':row.state==='active'?'已激活':'状态未记录';}
function projectBadge(p){const rows=projectCollaborations(p.id);if(!rows.length)return badge(projectStatus(p));const pending=rows.every(row=>row.state==='pending_review'),active=rows.some(row=>row.state==='active');return badge(pending?'review':active?'running':'observed','会话协作 · '+(pending?'待复核':active?'已激活':'状态未记录'));}
function collaborationSection(projectId){const rows=projectCollaborations(projectId);if(!rows.length)return '';return `<section class="panel project-collaboration" aria-label="会话协作"><h2>会话协作</h2>${rows.map(row=>`<article><div class="spread wrap"><h3>${esc(row.title||'当前会话协作')}</h3>${badge(row.state==='pending_review'?'review':row.state==='active'?'running':'observed',collaborationStatus(row))}</div>${row.goal?`<p class="record-body">${esc(row.goal)}</p>`:''}<dl class="kv"><dt>来源节点</dt><dd>${esc(row.ownerNodeId||'未记录')}</dd><dt>最近更新</dt><dd>${esc(planTime(row.updatedAt))}</dd></dl>${technical('collaboration',row.sessionId||projectId,`<p>来源会话：${esc(row.sessionId||'未记录')}</p><p>工作区：${esc(row.cwd||'未记录')}</p>`)}<h3>最近阶段摘要</h3><p class="record-body">${esc(row.summary||'尚未记录阶段摘要')}</p><p class="hint">中央尚未验收。${row.state==='pending_review'?'已提交会话进展，等待中央复核。':'当前会话已激活协作；执行进展与最终验收分别记录。'}</p></article>`).join('')}</section>`;}
function projectCard(p,action='project'){let rows=tasksFor(p.id);return `<button class="project-card ${action==='scope-select'&&state.scope===p.id?'scope-selected':''}" data-status="${projectStatus(p)}" data-action="${action}" data-id="${p.id}"><div class="spread"><span class="project-symbol">${icon('folder')}</span>${projectBadge(p)}</div><h2>${esc(p.title)}</h2><p>${esc(p.description)}</p><div class="summary-strip"><span class="status-text" data-status="running"><b>${count(rows,'running')}</b> 执行中</span><span class="status-text" data-status="review"><b>${count(rows,'review')}</b> 待确认</span>${projectCollaborations(p.id).length?'<span>当前会话协作 · 中央跟进</span>':state.records.projectRegistrations?.some(r=>r.projectId===p.id)?'<span>来源项目 · 已登记</span>':`<span>统筹会话 <b>${p.session}</b></span>`}</div><div class="next">下一步 · ${esc(p.next)}</div><span class="entity-arrow" aria-hidden="true">${icon('arrow')}</span></button>`}
function planById(id){return (state.records.schedules||[]).find(s=>s.scheduleId===id);}
function planTime(value,zone){if(!value||!Number.isFinite(Date.parse(value)))return '未记录';try{return new Date(value).toLocaleString('zh-CN',{...(zone?{timeZone:zone}:{}),hour12:false});}catch{return value;}}
function planCadence(s){if(s.intervalMs)return `每 ${s.intervalMs/60000} 分钟`;const daily=s.cron?.match(/^(\d+) (\d+) \* \* \*$/);return daily?`每天 ${daily[2].padStart(2,'0')}:${daily[1].padStart(2,'0')} · ${s.timeZone}`:`${s.cron||'未记录规则'} · ${s.timeZone}`;}
function planStatus(s){return s.retiredAt?'已停用':s.blocked?'任务已终止':s.enabled?'已启用':'已暂停';}
function planControls(s){return s.retiredAt||s.blocked?'':btn('schedule-control',s.enabled?'暂停计划':'恢复计划','outline','data-id="'+esc(s.scheduleId)+'"');}
function planCards(scope){const rows=(state.records.schedules||[]).filter(s=>!scope||scope==='all'||s.project===scope);return `<div class="stack">${rows.map(s=>`<section>${linkCard('schedule-detail',s.scheduleId,s.title,planStatus(s)+' · '+planCadence(s)+' · '+(s.project==='unassigned'?'独立计划':project(s.project).title))}<div class="row wrap plan-actions">${planControls(s)}</div></section>`).join('')||'<div class="empty">暂无定时计划。创建计划后，每次触发都会生成独立执行记录。</div>'}</div>`;}

function renderSchedules(){return topbar('<span class="project-list-link">'+backButton('projects','返回项目中心')+'定时计划</span>','管理触发规则；每次触发创建新的 Run',btn('create-schedule','新建定时计划','fill'))+`<section class="page"><div class="page-inner">${!isReadOnly()&&state.records.scheduleRuntime&&(!state.records.scheduleRuntime.enabled||!state.records.scheduleRuntime.ticking)?'<p class="notice">当前宿主没有启用自动调度，请在调度端任务系统设置中启用调度与保活；计划仍会保存。</p>':''}${scopeSelector()}<p class="hint">默认上次尚未结束时跳过本次；暂停不打断已触发的执行。计划启停与任务执行状态分别记录。</p>${planCards(state.scope)}</div></section>`;}
function renderScheduleDetail(){const s=planById(state.scheduleId);if(!s)return renderSchedules();const history=[...(s.occurrences||[])].reverse();return topbar('<span class="project-list-link">'+backButton('schedules-return','返回定时计划')+esc(s.title)+'</span>',planStatus(s)+' · '+planCadence(s),planControls(s))+`<section class="page"><div class="page-inner"><section class="panel"><h2>计划详情</h2><p>${esc(s.project==='unassigned'?'独立计划':project(s.project).title)} · ${esc(s.node)} · ${esc(s.model)}</p><p>${s.enabled&&!s.blocked&&!s.retiredAt?'下次触发 · '+esc(planTime(s.nextDueAt,s.timeZone)):'当前不再触发新执行'}</p><p class="hint">暂停不打断已触发的执行；恢复从下一个时间点开始。${s.overlap==='skip'?'上次未结束时跳过本次。':'重叠时按原计划排队。'}</p>${s.project!=='unassigned'?linkCard('project',s.project,'查看项目节点图',project(s.project).title):''}${linkCard('task',s.taskId,'关联任务 · '+s.title,'查看任务要求与执行报告')}</section><h2>触发历史</h2><div class="stack">${history.map(o=>{const r=(state.records.runs||[]).find(r=>r.id===o.runId);return r?linkCard('schedule-run',runKey(r),runTitle(r)+' · '+planTime(o.scheduledFor,s.timeZone),runResultLabel(r)+' · 查看本次结果'):`<section class="panel"><h3>${esc(planTime(o.scheduledFor,s.timeZone))}</h3><p>${esc(({'skipped-overlap':'跳过 · 上次尚未结束','skipped-misfire':'跳过 · 错过触发时间',admitted:'已创建执行'})[o.status]||'触发状态未记录')}</p></section>`;}).join('')||'<p class="empty">尚未触发；到达计划时间后在这里记录每次执行。</p>'}</div></div></section>`;}
function planModelKey(route){return JSON.stringify([route.provider,route.model,route.backend||'']);}
function planSelectOptions(rows,value){return rows.map(r=>`<option value="${esc(r.id)}" ${value===r.id?'selected':''}>${esc(r.label||r.title)}</option>`).join('');}
function planUnique(rows,key,label){return [...new Map(rows.map(r=>[key(r),{id:key(r),label:label(r)}])).values()];}
function syncPlanRoute(o){const d=o.draft,all=o.options.routes;const select=(key,rows,value)=>{if(!rows.some(r=>value(r)===d[key]))d[key]=rows.length?value(rows[0]):'';return rows.filter(r=>value(r)===d[key]);};let rows=select('nodeId',all,r=>r.route.nodeId);rows=select('modelKey',rows,r=>planModelKey(r.route));rows=select('reasoningEffort',rows,r=>r.route.reasoningEffort||'');rows=select('workspaceId',rows,r=>r.route.workspaceId||'');d.routeId=rows[0]?.id||'';}
function scheduleForm(o){const d=o.draft,disabled=o.pending?'disabled':'',routes=o.options.routes,nodeRoutes=routes.filter(r=>r.route.nodeId===d.nodeId),modelRoutes=nodeRoutes.filter(r=>planModelKey(r.route)===d.modelKey),effortRoutes=modelRoutes.filter(r=>(r.route.reasoningEffort||'')===d.reasoningEffort);return dialog(o.taskMode?'新建任务':'新建定时计划',o.taskMode?'选择执行方式、参数与触发方式':'在项目中创建周期执行计划',`<label class="form-field">计划名称<input data-plan="title" maxlength="500" value="${esc(d.title)}" ${disabled}></label><label class="form-field">任务要求<textarea data-plan="description" maxlength="20000" ${disabled}>${esc(d.description)}</textarea></label><label class="form-field">关联项目<select data-plan="projectId" required ${disabled}><option value="" disabled ${!d.projectId?'selected':''}>请选择项目</option>${planSelectOptions(o.options.projects,d.projectId)}</select></label>${!o.options.projects.length?'<p class="notice">请先创建项目，再为该项目创建定时计划。</p>':'<p class="hint">计划的任务、执行与产物会显示在该项目的节点图中。</p>'}${taskCreationExecution(o)}${d.executionKind==='workflow'?'':`<label class="form-field">执行端<select data-plan="nodeId" ${disabled}>${planSelectOptions(planUnique(routes,r=>r.route.nodeId,r=>r.route.nodeId),d.nodeId)}</select></label><label class="form-field">模型<select data-plan="modelKey" ${disabled}>${planSelectOptions(planUnique(nodeRoutes,r=>planModelKey(r.route),r=>r.route.model+' · '+r.route.provider+(r.route.backend?' · '+r.route.backend:'')),d.modelKey)}</select></label><label class="form-field">推理强度<select data-plan="reasoningEffort" ${disabled}>${planSelectOptions(planUnique(modelRoutes,r=>r.route.reasoningEffort||'',r=>r.route.reasoningEffort||'默认'),d.reasoningEffort)}</select></label><label class="form-field">执行工作区<select data-plan="workspaceId" ${disabled}>${planSelectOptions(planUnique(effortRoutes,r=>r.route.workspaceId||'',r=>r.workspaceLabel||r.route.workspaceId||'默认'),d.workspaceId)}</select></label><p class="hint">模型来自执行端最近上报的可用目录，并受执行授权限制。</p>${btn('schedule-options-refresh','刷新执行端与模型','outline',disabled)}${!routes.length?'<p class="notice">尚无执行端上报可用且已授权的模型与工作区，请先检查执行端连接和模型配置。</p>':''}`}<label class="form-field">触发方式<select data-plan="mode" ${disabled}>${o.taskMode?`<option value="manual" ${d.mode==='manual'?'selected':''}>手动运行</option><option value="now" ${d.mode==='now'?'selected':''}>创建后立即运行</option>`:''}<option value="interval" ${d.mode==='interval'?'selected':''}>固定间隔</option><option value="daily" ${d.mode==='daily'?'selected':''}>每天</option></select></label>${d.mode==='interval'?`<label class="form-field">间隔（分钟）<input data-plan="minutes" type="number" min="1" max="527040" value="${esc(d.minutes)}" ${disabled}></label><p class="hint">首次触发在创建成功后的一个间隔。</p>`:d.mode==='daily'?`<label class="form-field">每天时间<input data-plan="time" type="time" value="${esc(d.time)}" ${disabled}></label><label class="form-field">时区<input data-plan="timeZone" value="${esc(d.timeZone)}" placeholder="Australia/Melbourne" ${disabled}></label>`:''}<p class="hint">上次未结束时跳过本次；调度端短暂离线后最多补一次。暂停后恢复不补跑暂停期间。</p>`,btn('create-schedule-confirm',o.pending?'正在创建…':o.taskMode?'创建任务':'创建计划','fill',o.pending||(d.executionKind==='workflow'?!d.workflowId:!d.routeId)||!d.projectId?'disabled':''));}
function scheduleRunDetail(id){const r=(state.records.runs||[]).find(r=>runKey(r)===id);if(!r||state.overlay?.taskId&&r.taskId!==state.overlay.taskId)return dialog('执行记录','', '<p>记录已不可用，请刷新。</p>','');const reports=(state.records.reports||[]).filter(report=>report.runId===id&&(state.overlay?.reportId?report.id===state.overlay.reportId:report.kind==='result'));if(state.overlay?.reportId&&!reports.length)return dialog('报告不可用','', '<p>该报告不属于这次执行，或未包含在当前授权视图中。</p>','');const t=task(r.taskId),final=reports.filter(report=>report.kind==='result'),materials=reports.filter(report=>report.kind!=='result');return drawer('本次执行结果',esc(t?.title||'执行记录'),detailGroup('result','结果',`<section class="detail-section"><h3>${esc(runTitle(r))}</h3><p>${esc(runResultLabel(r))}</p></section>${materials.length?'':`<section class="execution-report"><h3>本次最终报告</h3>${workflowReportResult(r,final)}</section>`}`)+detailGroup('process','过程',`<section class="detail-section"><h3>执行信息</h3><p>开始于 ${esc(planTime(r.executionStartedAt||r.createdAt))}${r.executionEndedAt?' · 耗时 '+elapsedText(r.executionStartedAt||r.createdAt,r.executionEndedAt):''}</p></section>`+workflowRunSection(t,r)+workflowStepDetails(t,r)+(t?childAttentionSection(t,id)+recursiveSection(t.id,id):''))+detailGroup('related','关联',workflowOrigin(r)+`<section class="detail-section"><h3>关联任务</h3>${linkCard('task',r.taskId,t?.title||'查看任务','查看任务要求和其他执行记录')}${t&&t.project!=='unassigned'?linkCard('task-project',t.id,'所属项目 · '+project(t.project).title,project(t.project).goal):''}</section>`)+detailGroup('technical','溯源与技术细节',`<p>${r.executionDriver==='workflow'?'执行设备与模型按流程阶段记录。':'执行端：'+esc(r.node||'未记录')+' · 模型：'+esc(r.actualModel||r.model||'未记录')}</p>`+executionInput(r)+executionDiagnostics(r)+runProof(r))+detailGroup('supplement','补充材料',executionSupplement(r)+(materials.length?`<section class="detail-section"><h3>执行材料</h3>${materials.map(report=>readableReport(report.body,report.id)).join('')}</section>`:'')));}

function graphShape(kind,w=100,h=70){const bevel=Math.min(14,w*.14),fold=Math.min(16,w*.18),shapes={'项目':`<path d="M${bevel} 2 H${w-bevel} L${w-2} ${h/2} L${w-bevel} ${h-2} H${bevel} L2 ${h/2} Z"/>`,'任务':`<rect x="2" y="2" width="${w-4}" height="${h-4}" rx="${Math.min(9,h*.1)}"/>`,'执行':`<path d="M${bevel} 2 H${w-2} L${w-bevel} ${h-2} H2 Z"/>`,'产物':`<path d="M2 2 H${w-fold} L${w-2} ${fold} V${h-2} H2 Z"/><path d="M${w-fold} 2 V${fold} H${w-2}" fill="none"/>`};return `<svg class="node-shape" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${shapes[kind]}</svg>`}

const flowStateNames={pending:'等待调用',waiting_device:'等待设备',queued:'等待执行',running:'执行中',succeeded:'已完成',partial:'部分交付',failed:'失败',uncertain:'结果待核实',cancelled:'已取消',blocked:'调用受阻',needs_attention:'需处理'};

function flowStageView(def){const steps=def.steps||[],stages=def.stages?.length?def.stages:steps.map((step,index)=>({stageId:step.stageId||step.stepId,title:step.title,nodeId:step.nodeId,position:{x:index*300,y:40}}));return stages.map((stage,index)=>({...stage,x:Number.isFinite(stage.position?.x)?stage.position.x:index*300,y:Number.isFinite(stage.position?.y)?stage.position.y:40,steps:steps.filter(step=>(step.stageId||step.stepId)===stage.stageId)}));}
function flowCalls(def){return Array.isArray(def.calls)?def.calls:(def.steps||[]).flatMap(step=>(step.dependsOn||[]).map(fromStepId=>({fromStepId,toStepId:step.stepId})));}
const projectFlowEdits=new Map();
let projectFlowDrag=null,projectFlowSuppressClick=0;
function projectFlowEdit(){return projectFlowEdits.get(state.projectFlowEditing);}
async function editProjectFlow(workflowId){const snapshot=await api('workflowView',{workflowRunId:null}),definition=snapshot.definitions.find(flow=>flow.workflowId===workflowId&&flow.projectId===current().id);if(!definition)throw Error('当前项目流程已不可用，请刷新');if(!projectFlowEdits.has(workflowId))projectFlowEdits.set(workflowId,{definition:structuredClone(definition),revision:definition.revision,dirty:false,pending:false,error:''});state.projectFlowEditing=workflowId;render();}
function checkProjectCalls(def){const ids=new Set(def.steps.map(step=>step.stepId)),seen=new Set(),visiting=new Set(),done=new Set();for(const call of def.calls){if(call.fromStepId===call.toStepId)throw Error('不能将步骤连接到自身');if(!ids.has(call.fromStepId)||!ids.has(call.toStepId))throw Error('调用端口对应的步骤不存在');const key=JSON.stringify([call.fromStepId,call.toStepId]);if(seen.has(key))throw Error('这条调用连线已存在');seen.add(key);}function visit(id){if(visiting.has(id))throw Error('调用顺序存在循环，请调整连线');if(done.has(id))return;visiting.add(id);for(const call of def.calls.filter(call=>call.fromStepId===id))visit(call.toStepId);visiting.delete(id);done.add(id);}ids.forEach(visit);for(const step of def.steps)for(const binding of Object.values(step.inputs||{}))if(binding.kind==='step-output'&&!def.calls.some(call=>call.fromStepId===binding.stepId&&call.toStepId===step.stepId))throw Error(`${step.title} 仍使用上游输出；请先在步骤设置中删除或重新绑定输入`);}
function changeProjectCall(fromStepId,toStepId,remove=false){const edit=projectFlowEdit();if(!edit||edit.pending)throw Error('请先编辑当前流程定义');const next=structuredClone(edit.definition);next.calls=remove?flowCalls(next).filter(call=>call.fromStepId!==fromStepId||call.toStepId!==toStepId):[...flowCalls(next),{fromStepId,toStepId}];checkProjectCalls(next);for(const step of next.steps)step.dependsOn=next.calls.filter(call=>call.toStepId===step.stepId).map(call=>call.fromStepId);edit.definition=next;edit.dirty=true;edit.error='';state.projectConnectFrom=null;render();}
function flowBox(stage,editable){const titleLines=Math.max(1,Math.ceil(stage.title.length/17));return {...stage,w:300,h:104+titleLines*24+(editable?stage.steps.reduce((sum,step)=>sum+Math.max(34,Math.ceil(step.title.length/18)*18+12),0):stage.steps.reduce((sum,step)=>sum+Math.max(28,Math.ceil(step.title.length/18)*18+10),0)),header:80+titleLines*24};}
function flowGraph(def,run,compact=false,editable=false){
 const stages=flowStageView(def).map(stage=>flowBox(stage,editable)),byStep=new Map(stages.flatMap(stage=>stage.steps.map(step=>[step.stepId,stage]))),edges=flowCalls(def).filter(call=>byStep.get(call.fromStepId)&&byStep.get(call.toStepId)&&byStep.get(call.fromStepId)!==byStep.get(call.toStepId));
 if(!stages.length)return '<p class="empty">尚未添加执行阶段。</p>';
 const top=Math.min(...stages.map(stage=>stage.y)),start={x:Math.min(...stages.map(stage=>stage.x))-160,y:top+30,w:100,h:52},end={x:Math.max(...stages.map(stage=>stage.x+stage.w))+60,y:top+30,w:100,h:52};
 const minX=start.x-30,minY=top-40,width=end.x+end.w-minX+30,height=Math.max(...stages.map(stage=>stage.y+stage.h),end.y+end.h)-minY+40;
 const incoming=new Set(flowCalls(def).map(call=>call.toStepId)),outgoing=new Set(flowCalls(def).map(call=>call.fromStepId));
 const boundaryStages=entry=>[...new Set((def.steps||[]).filter(step=>!(entry?incoming:outgoing).has(step.stepId)).map(step=>byStep.get(step.stepId)).filter(Boolean))];
 const terminalLines=[...boundaryStages(true).map(stage=>`<path class="flow-terminal-edge" d="M${start.x+start.w} ${start.y+start.h/2} L${stage.x} ${stage.y+stage.h/2}" marker-end="url(#flow-invocation-arrow)"/>`),...boundaryStages(false).map(stage=>`<path class="flow-terminal-edge" d="M${stage.x+stage.w} ${stage.y+stage.h/2} L${end.x} ${end.y+end.h/2}" marker-end="url(#flow-invocation-arrow)"/>`)].join('');
 const terminalNodes=[[start,'开始'],[end,'结束']].map(([box,title])=>`<g class="project-flow-terminal" aria-label="${title}"><rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="26"/><text x="${box.x+box.w/2}" y="${box.y+box.h/2+5}" text-anchor="middle">${title}</text></g>`).join('');
 const endpoint=(stage,id)=>editable?stage.y+stage.header+stage.steps.slice(0,stage.steps.findIndex(step=>step.stepId===id)).reduce((sum,step)=>sum+Math.max(34,Math.ceil(step.title.length/18)*18+12),0)+17:stage.y+stage.h/2;
 const lines=edges.map(call=>{const from=byStep.get(call.fromStepId),to=byStep.get(call.toStepId),ax=from.x+from.w,ay=endpoint(from,call.fromStepId),bx=to.x,by=endpoint(to,call.toStepId);return `<path d="M${ax} ${ay} C${ax+65} ${ay},${bx-65} ${by},${bx} ${by}" marker-end="url(#flow-invocation-arrow)"><title>${esc(call.fromStepId+' → '+call.toStepId)}</title></path>`;}).join('');
 const nodes=stages.map(stage=>{const views=run?.steps.filter(step=>stage.steps.some(defStep=>defStep.stepId===step.stepId))||[],live=(state.records.nodes||[]).find(node=>node.nodeId===stage.nodeId),done=views.filter(step=>['succeeded','partial'].includes(step.state)).length,result=!run?'流程定义':views.length&&done===views.length?'阶段已完成':views.some(step=>['failed','uncertain','blocked'].includes(step.state))?'阶段需处理':views.some(step=>step.state==='running')?'阶段执行中':'阶段等待调用';return `<foreignObject data-project-stage="${esc(stage.stageId)}" x="${stage.x}" y="${stage.y}" width="${stage.w}" height="${stage.h}"><article xmlns="http://www.w3.org/1999/xhtml" class="project-flow-stage${editable?' editable':''}"><button type="button" class="project-flow-heading" ${editable?`data-project-drag="${esc(stage.stageId)}"`:`data-action="workflow-stage" data-id="${esc(JSON.stringify({workflowId:def.workflowId,stageId:stage.stageId,runId:run?.runId||run?.workflowRunId||null}))}"`} aria-label="${editable?'拖动阶段':'阶段'} ${esc(stage.title)}"><strong>${esc(stage.title)}</strong></button><small>执行设备：${esc(stage.nodeId)} · 当前${live?.state==='online'?'在线':live?.state==='disabled'?'已停用':'离线或未知'}</small><span>${esc(result)} · ${stage.steps.length} 个内部步骤</span>${editable?`<div class="project-flow-ports">${stage.steps.map(step=>`<div class="project-flow-port-row"><button type="button" class="project-flow-port" data-project-port="in" data-project-step="${esc(step.stepId)}" aria-label="调用 ${esc(step.title)} 的输入">● 输入</button><span>${esc(step.title)}</span><button type="button" class="project-flow-port${state.projectConnectFrom===step.stepId?' selected':''}" data-project-port="out" data-project-step="${esc(step.stepId)}" aria-label="从 ${esc(step.title)} 的输出调用">输出 ●</button></div>`).join('')}</div>`:`<ul class="project-flow-step-list">${stage.steps.map(step=>`<li><span>${esc(step.title)}</span><small>${esc(({program:'程序',agent:'Agent',unbound:'待选执行方式'})[step.kind||step.execution?.kind]||'步骤')}</small></li>`).join('')}</ul>`}</article></foreignObject>`;}).join('');
 return `<div class="project-flow-viewport${compact?' compact':''}${editable?' editing':''}" aria-label="${run?'历史执行流程（只读）':editable?'编辑项目流程定义':'项目流程定义'}"><svg viewBox="${minX} ${minY} ${width} ${height}" data-flow-fit="${minX},${minY},${width},${height}" preserveAspectRatio="xMidYMid meet" role="group" aria-label="${esc(def.title)}执行阶段与调用顺序"><defs><marker id="flow-invocation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z"/></marker></defs><g class="project-flow-edges">${lines}${terminalLines}</g>${terminalNodes}${nodes}</svg></div>`;

function recursiveSection(taskId,selectedRunId=null){

document.addEventListener('pointerup',event=>{const drag=projectFlowDrag;if(!drag||drag.pointer!==event.pointerId)return;projectFlowDrag=null;if(!drag.moved)return;projectFlowSuppressClick={until:Date.now()+300,x:event.clientX,y:event.clientY};if(drag.kind==='connect'){const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-project-port="in"]');if(target)try{changeProjectCall(drag.from,target.dataset.projectStep);}catch(error){projectFlowEdit().error=error.message;render();}else{state.projectConnectFrom=drag.from;render();}}else render();});
document.addEventListener('pointercancel',()=>{projectFlowDrag=null;});

document.addEventListener('click',ev=>{if(projectFlowSuppressClick&&Date.now()<projectFlowSuppressClick.until&&Math.hypot(ev.clientX-projectFlowSuppressClick.x,ev.clientY-projectFlowSuppressClick.y)<4&&ev.target.closest('.project-flow-viewport')){ev.preventDefault();return;}const port=ev.target.closest('[data-project-port]');if(port?.dataset.projectPort){const edit=projectFlowEdit();if(!edit)return;try{if(port.dataset.projectPort==='out'){state.projectConnectFrom=port.dataset.projectStep;render();}else if(state.projectConnectFrom)changeProjectCall(state.projectConnectFrom,port.dataset.projectStep);}catch(error){edit.error=error.message;render();}return;}let el=ev.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='backdrop'){if(ev.target===el)closeOverlay();return;}actions(el.dataset.action,el.dataset.id)});
document.addEventListener('input',ev=>{captureProjectDraft();updatePlanDraft(ev);if(ev.target.id==='retry-prompt'&&state.overlay?.action==='retry')state.overlay.retryPrompt=ev.target.value;if(ev.target.id==='message-input')state.draft=ev.target.value;if(ev.target.id==='project-search'){let pos=ev.target.selectionStart;state.search=ev.target.value;render();const field=document.getElementById('project-search');field.focus();field.setSelectionRange(pos,pos)}if(ev.target.dataset.handoff)state.handoffSelections[ev.target.dataset.handoff]=ev.target.checked});
document.addEventListener('change',ev=>{if(ev.target.id==='project-flow-choice'){state.projectFlowId=ev.target.value;render();return;}updatePlanDraft(ev);if(ev.target.id==='project-scope'){state.scope=ev.target.value;if(state.scope!=='all')state.project=state.scope;state.filter='all';render()}});
document.addEventListener('change',ev=>{if(state.overlay?.type==='create'){captureProjectDraft();const o=state.overlay;if(ev.target.id==='project-workspace-mode'){o.workspaceMode=ev.target.value;o.workspace=undefined;o.browsing=false;}else if(ev.target.id==='project-workspace-id'){const w=state.records.workspaceOptions?.workspaces.find(w=>w.workspaceId===ev.target.value);o.workspace=w?{kind:'registered',nodeId:w.nodeId,workspaceId:w.workspaceId}:undefined;}else if(ev.target.id==='project-directory-hidden')o.showHidden=ev.target.checked;else if(ev.target.id==='project-provider')o.selection={provider:ev.target.value,model:''};else if(ev.target.id==='project-model')o.selection={provider:o.selection.provider,model:ev.target.value};else if(ev.target.id==='project-effort')o.selection={...o.selection,reasoningEffort:ev.target.value||undefined};else return;saveProjectDraft();renderOverlay();return;}if(state.overlay?.type==='manual-confirm'&&ev.target.name==='manual-choice'){state.overlay.choice=ev.target.value;return;}if(state.overlay?.type!=='conversation-model')return;const o=state.overlay,providers=state.conversationModels.providers;if(ev.target.id==='conversation-provider'){const provider=providers.find(p=>p.id===ev.target.value);o.selection={provider:provider.id,model:provider.models[0]?.id??''};}else if(ev.target.id==='conversation-model'){o.selection={provider:o.selection.provider,model:ev.target.value};}else if(ev.target.id==='conversation-effort'){o.selection={...o.selection,reasoningEffort:ev.target.value||undefined};}else return;renderOverlay();});

document.addEventListener('submit',async ev=>{ev.preventDefault();if(ev.target.id==='create-form'){await actions('create-confirm');return;}if(ev.target.id==='temporary-form'){await actions('create-temporary-confirm');return;}if(ev.target.id!=='chat-form'||state.sending)return;const text=document.getElementById('message-input').value.trim();if(!text)return;state.sending=true;const commandId=state.sendCommand||(state.sendCommand=requestId());try{const target=recipient();if(state.pendingSend&&(state.pendingSend.owner!==current().id||state.pendingSend.input.text!==text))throw Error('上条消息的发送结果未确认，请回到原对话并用原消息重试');if(state.recipientSession&&!target)throw Error('原会话已变化，请重新选择对话对象');state.pendingSend??={owner:current().id,method:target?'sendExecutorMessage':current().taskId?'sendTaskMessage':'sendProjectMessage',input:target?{...(current().taskId?{}:{projectId:current().id}),taskId:target.taskId,nodeId:target.nodeId,sessionId:target.sessionId,commandId,text}:{...(current().taskId?{taskId:current().taskId}:{projectId:current().id}),commandId,text}};await api(state.pendingSend.method,state.pendingSend.input);state.pendingSend=null;state.sendCommand=null;state.draft='';const input=document.getElementById('message-input');if(input)input.value='';await loadConversation();updateConversation();const messages=document.querySelector('#messages');if(messages)messages.scrollTop=messages.scrollHeight;}catch(error){notify(error.message,'error');}finally{state.sending=false;}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeOverlay();});
window.addEventListener('resize',()=>{if(state.view==='project-detail')render()});
state.loaded=false;state.loadError=null;state.loadedAt=null;state.records={};state.settings={root:null,revision:0};state.turns=[];state.sessions=[];
const requests=new Map();
function api(method,input){return new Promise((resolve,reject)=>{const id=requestId(),timer=setTimeout(()=>{requests.delete(id);reject(Object.assign(Error('连接超时，请重试；已提交的操作会按原 ID 核对'),{code:'client/timeout'}))},45000);requests.set(id,{resolve,reject,timer});parent.postMessage({channel:'dsh-project-runtime',id,method,input},'*');});}
window.addEventListener('message',event=>{if(event.source!==window.parent || event.data?.channel!=='dsh-project-runtime' || event.data.method!=='navigate' || !['tasks','projects','fullpanel'].includes(event.data.input))return;const target=event.data.input;void actions({tasks:'home',projects:'projects',fullpanel:'fullpanel'}[target]).then(()=>window.parent.postMessage({channel:'dsh-project-runtime',method:'navigateAcknowledged',input:target},'*'));});
window.addEventListener('message',ev=>{if(ev.source!==parent||ev.data?.channel!=='dsh-project-runtime')return;if(ev.data.method==='theme'){if(['light','dark'].includes(ev.data.input))document.documentElement.dataset.theme=ev.data.input;return;}const call=requests.get(ev.data.id);if(!call)return;clearTimeout(call.timer);requests.delete(ev.data.id);ev.data.error?call.reject(Object.assign(Error(ev.data.error),{code:ev.data.errorCode,details:ev.data.errorDetails})):call.resolve(ev.data.value);});
async function loadConversation(){const p=current();if(!p.canChat)return;const key=p.id+':'+p.session;const data=await api(p.taskId?'taskConversation':'projectConversation',p.taskId?{taskId:p.taskId}:{projectId:p.id});if(current().id+':'+current().session!==key)return;current().messages=data.messages;state.turns=data.turns;state.sessions=data.sessions;state.conversationModel=data.conversationModel;state.executorTargets=data.executorTargets||[];if(state.recipientOwner!==p.id){state.recipientOwner=p.id;state.recipientSession=null;}}
async function refresh(){const data=await api('projectSnapshot');for(const p of data.projects)p.messages=state.projects.find(old=>old.id===p.id)?.messages||[];state.projects=data.projects;state.tasks=[...data.tasks].sort((a,b)=>(Date.parse(b.time)||0)-(Date.parse(a.time)||0));state.settings=data.settings;state.records=data;state.loaded=true;state.loadError=null;state.loadedAt=new Date().toLocaleTimeString();}
function renderLoadState(){
 const error=state.loadError,role=error?.code==='PLANNER_REQUIRED';
 return topbar('项目与任务',role?'当前宿主 · 执行端':'项目服务')+`<section class="page"><div class="page-inner"><section class="panel" role="${error?'alert':'status'}" aria-live="polite"><h2>${role?'当前节点是执行端':error?'项目任务中心暂不可用':'正在读取项目与任务…'}</h2>${error?`<p>${esc(error.message)}</p>${role?'<p class="hint">请打开调度端 DSH 的“项目与任务”页面，创建项目、发起任务或查看全局进度。本机接收并执行派来的任务；本机队列与调度端连接可在“任务中心右上角的设置”查看。</p>':'<p class="hint">数据尚未读取成功，无法显示任务数量。</p>'}<div class="row wrap">${btn('reload',role?'重新检查角色':'重新加载','outline')}</div>`:'<p class="hint">读取完成后显示项目和任务状态。</p>'}</section></div></section>`;
}
function renderLoadNotice(){return `<section class="panel" role="alert"><p>${esc(state.loadError.message)} 保留上次 ${esc(state.loadedAt)} 读取的数据，当前状态可能已变化。</p>${btn('reload','重新加载','outline')}</section>`;}
let refreshing=false,last='';async function poll(){
 if(refreshing||state.loadError?.code==='PLANNER_REQUIRED')return;
 refreshing=true;
 try{
  const recovering=!!state.loadError;
  await refresh();if(window.__DSH_PROJECT_CONTEXT__&&!state.projectContextApplied){state.projectContextApplied=true;const context=window.__DSH_PROJECT_CONTEXT__;if(state.projects.some(p=>p.id===context.projectId)){openProject(context.projectId);if(context.taskId)state.overlay=context.runId?{type:'schedule-run',id:context.runId,taskId:context.taskId,reportId:context.reportId||null}:{type:'task',id:context.taskId};}}if(state.view==='conversation')await loadConversation();
  const fingerprint=JSON.stringify([state.projects,state.tasks,state.turns,state.records.nodes,state.records.schedules,state.records.runs,state.records.attempts,state.records.projectRegistrations,state.records.projectCollaborations,state.records.viewContext,state.conversationModel]);
  if(state.view==='conversation'){updateConversation();if(['task','schedule-run'].includes(state.overlay?.type))renderOverlay();last=fingerprint;}else if(recovering||fingerprint!==last){last=fingerprint;if(!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!state.overlay)render();else if(['task','schedule-run'].includes(state.overlay?.type))renderOverlay();}
 }catch(error){const changed=state.loadError?.message!==error.message||state.loadError?.code!==error.code;state.loadError={message:error.message,code:error.code};if(changed){if(state.view==='conversation')notify(error.message||'连接暂时中断','error');else render();}}
 finally{refreshing=false;}
}
render();poll();setInterval(poll,3000);setInterval(updateElapsed,1000);
</script>
</body></html>
