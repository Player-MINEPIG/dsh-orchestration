- insert:
    - id: task-typed-decisions
      name: '@dsh-task/typed-decisions'
      config:
        defaultProvider: rules
        timeoutMs: 10000
        maxAttempts: 1
        failureLimit: 3
        cooldownMs: 30000
        maxReceipts: 10000
        providers:
          - id: rules
            kind: rules
            rulesVersion: '1'
            rules: []
    - id: typed-decision-native-completion
      name: '@dsh-task/typed-decisions/dsh-completion'
      config:
        routes: []
        maxOutputTokens: 2048
        maxInputBytes: 65536
        maxOutputBytes: 131072
        maxRuntimeMs: 10000
        maxConcurrent: 2
