<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122b28">
  <meta name="description" content="DSH 任务看板：查看任务的当前进展、每次执行与完整报告历史。">
  <title>DSH · 任务看板</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#tasks" aria-label="DSH 任务首页"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><span>DSH<small>TASK SYSTEM</small></span></a>
      <div class="sidebar-caption">统一任务框架</div>
      <nav id="navigation">
        <a href="#tasks" data-nav="tasks"><span aria-hidden="true">◫</span>任务 <small>Task</small><b id="task-count"></b></a>
        <a href="#runs" data-nav="runs"><span aria-hidden="true">▷</span>执行 <small>Run</small></a>
        <a href="#reports" data-nav="reports"><span aria-hidden="true">▤</span>报告 <small>Report</small></a>
        <a href="#configuration" data-nav="configuration"><span aria-hidden="true">☷</span>配置 <small>Config</small></a>
      </nav>
      <div class="sidebar-footer"><span class="privacy-icon" aria-hidden="true">⌂</span><div>云电脑本地视图<small>只读 · 不对公网开放</small></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb" id="breadcrumb">任务看板</div><div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-status">连接中</span><button id="refresh-button" class="icon-button" aria-label="刷新任务数据" title="刷新任务数据"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.2 7a7 7 0 0 1 11.5-1L20 9M4 15l2.3 3a7 7 0 0 0 11.5-1"/></svg></button></div></header>
      <main id="main" tabindex="-1"><div class="initial-state" role="status"><span class="loading-ring"></span><h1>读取任务记录</h1><p>正在连接同一套 DSH 任务框架</p></div></main>
      <footer class="page-footer"><span>Task → Run → Report</span><span id="footer-source">正在读取数据来源</span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
