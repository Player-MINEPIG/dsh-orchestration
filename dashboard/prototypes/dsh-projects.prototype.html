[data-status="done"],[data-status="success"],[data-status="online"],[data-status="enabled"]{--state-color:var(--status-done)}
[data-status="error"]{--state-color:var(--status-error)}

12px">${p.id==="p1"?"实现与实机验收":"阶段验收"}</strong><p>按项目要求检查结果与证据。</p></div></div></div></section></div></div>`}

function materials(){let p=current();return `<div class="intro"><h2>项目资料</h2><p>项目描述、关键决策和执行产物按项目保留。</p></div><section class="panel"><h3>长期上下文</h3>${[['项目描述.md','目标、约束、验收标准','memory'],['关键决策.md','已确认方案与取舍','memory'],['统筹会话交接记录.md',`${Math.max(0,p.session-1)} 次交接 · 来源可追溯`,'history']].map(([title,sub,act])=>`<button class="file-row wide" data-action="${act}" style="text-align:left">${icon('file')}<span style="flex:1"><strong>${title}</strong><small>${sub}</small></span>${icon('arrow')}</button>`).join('')}</section><div class="section-label"><h2>任务产物</h2><small>${tasksFor(p.id).length} 份</small></div><section class="panel">${tasksFor(p.id).map(t=>`<button class="file-row wide" style="text-align:left" data-action="task" data-id="${t.id}">${icon('file')}<span style="flex:1"><strong>${esc(t.artifact)}</strong><small>${esc(t.title)}</small></span>${badge(resultStatus(t))}<span></span>${icon('arrow')}</button>`).join('')}</section>`}

function renderProjectPicker(){

 <section class="page"><div class="page-inner"><div class="intro"><div class="eyebrow">PROJECTS</div><h1>你想关注哪个项目？</h1><p>查看完整目标与进度，选择后继续当前任务视图。</p></div>

function projectStatus(p){const ts=tasksFor(p.id);return ts.some(t=>t.status==='running')?'running':ts.some(t=>t.status==='review')?'review':ts.length&&ts.every(t=>t.status==='done')?'done':'queued'}
function graphShape(kind,w=100,h=70){const bevel=Math.min(14,w*.14),fold=Math.min(16,w*.18),shapes={'项目':`<path d="M${bevel} 2 H${w-bevel} L${w-2} ${h/2} L${w-bevel} ${h-2} H${bevel} L2 ${h/2} Z"/>`,'任务':`<rect x="2" y="2" width="${w-4}" height="${h-4}" rx="${Math.min(9,h*.1)}"/>`,'执行':`<path d="M${bevel} 2 H${w-2} L${w-bevel} ${h-2} H2 Z"/>`,'产物':`<path d="M2 2 H${w-fold} L${w-2} ${fold} V${h-2} H2 Z"/><path d="M${w-fold} 2 V${fold} H${w-2}" fill="none"/>`};return `<svg class="node-shape" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${shapes[kind]}</svg>`}
function graphNode(n){return `<button class="graph-node" data-kind="${n.kind}" data-status="${n.status}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px" data-action="${n.action}" data-id="${n.id}" aria-label="${esc(n.kind+'：'+n.title)}">${graphShape(n.kind,n.w,n.h)}<div class="graph-node-kind">${n.kind}<span class="graph-state">${labels[n.status]}</span></div><strong>${esc(n.title)}</strong><small>${esc(n.sub||'')}</small></button>`}
function renderNodeGraph(){
 const p=project(state.graphProject),ts=tasksFor(p.id),phone=innerWidth<=760;
 const width=phone?Math.max(218,innerWidth-84):Math.max(900,Math.min(1180,innerWidth-56-(innerWidth>=1500?90:64))-2), height=phone?Math.max(410,ts.length*242+160):Math.max(380,ts.length*158+90);
 const nodes=[],edges=[],taskNodes=new Map(), desktopNodeWidth=(width-156)/4, desktopX=index=>24+index*(desktopNodeWidth+36);
 const add=(id,kind,title,status,x,y,w,h,action,sub='')=>{let n={id,kind,title,status,x,y,w,h,action,sub};nodes.push(n);return n};
 const root=phone?add(p.id,'项目',p.title,projectStatus(p),30,22,width-60,86,'graph-project-info',p.stage):add(p.id,'项目',p.title,projectStatus(p),desktopX(0),40,desktopNodeWidth,90,'graph-project-info',p.stage);
 const curve=(a,b)=>phone?`M ${a.x+a.w/2} ${a.y+a.h} C ${a.x+a.w/2} ${a.y+a.h+20},${b.x+b.w/2} ${b.y-20},${b.x+b.w/2} ${b.y}`:`M ${a.x+a.w} ${a.y+a.h/2} C ${a.x+a.w+Math.min(45,(b.x-a.x-a.w)/2)} ${a.y+a.h/2},${b.x-Math.min(45,(b.x-a.x-a.w)/2)} ${b.y+b.h/2},${b.x} ${b.y+b.h/2}`;
 ts.forEach((t,i)=>{
  const y=phone?150+i*242:40+i*158;
  const tn=add(t.id,'任务',t.title,t.status,phone?30:desktopX(1),y,phone?width-60:desktopNodeWidth,86,'task',t.id);
  taskNodes.set(t.id,tn);
  edges.push({d:phone?`M ${root.x+root.w/2} ${root.y+root.h} L ${root.x+root.w/2} 125 L 9 125 L 9 ${tn.y+tn.h/2} L ${tn.x} ${tn.y+tn.h/2}`:curve(root,tn),dependency:false});
  const childWidth=phone?(width-30)/2:desktopNodeWidth;
  const rn=add(t.id,'执行',t.status==='queued'?'等待分配执行端':t.node,runStatus(t),phone?8:desktopX(2),phone?y+115:y,childWidth,phone?102:86,'task',t.run==='待创建'?'执行记录待创建':t.run);
  const reportStatus=resultStatus(t);
  const pn=add(t.id,'产物',reportStatus==='queued'?'等待执行结果':t.artifact,reportStatus,phone?width-childWidth-8:desktopX(3),phone?y+115:y,childWidth,phone?102:86,reportStatus==='queued'?'task':'artifact',reportStatus==='queued'?'结果返回后关联到任务':t.status==='review'?'已收到，等待审核':'已验收，保留来源');
  edges.push({d:curve(tn,rn),dependency:false});
  edges.push({d:phone?curve(tn,pn):curve(rn,pn),dependency:false});
 });
 for(const [after,before] of Object.entries({t3:'t2',t6:'t5',t8:'t7'})){
  const a=taskNodes.get(before),b=taskNodes.get(after);if(!a||!b)continue;
  const x=phone?width-7:desktopX(1)+desktopNodeWidth+18;
  edges.push({d:`M ${a.x+a.w} ${a.y+a.h/2} L ${x} ${a.y+a.h/2} L ${x} ${b.y+b.h/2} L ${b.x+b.w} ${b.y+b.h/2}`,dependency:true});
 }
 return `<div class="graph-heading"><div><div class="eyebrow">PROJECT RELATIONSHIPS</div><h2>关联节点</h2><p class="hint">${nodes.length} 个节点 · 点击节点查看详情</p></div></div>
 <div class="graph-legend shape-legend" aria-label="节点形状">${['项目','任务','执行','产物'].map(kind=>`<span><span class="shape-symbol">${graphShape(kind,32,22)}</span>${kind}</span>`).join('')}</div>
 <div class="graph-legend">${['running','review','queued','done'].map(status=>`<span data-status="${status}"><i></i>${labels[status]}</span>`).join('')}<small>虚线连接表示前置任务</small></div>
 <div class="graph-stage" data-project-id="${p.id}" data-layout="${phone?'phone':'desktop'}" aria-label="${esc(p.title)}关联节点图"><div class="graph-canvas" style="width:${width}px;height:${height}px"><svg class="graph-edges" width="${width}" height="${height}" aria-hidden="true"><defs><marker id="graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6e6e76"/></marker></defs>${edges.map(edge=>`<path d="${edge.d}" class="${edge.dependency?'dependency':''}" marker-end="url(#graph-arrow)"/>`).join('')}</svg>${nodes.map(graphNode).join('')}${!ts.length?'<div class="graph-empty">项目尚未创建任务。进入统筹对话后可登记工作。</div>':''}</div></div>
 <p class="hint graph-note">${phone?'上下滑动查看所有关联节点。':'左右、上下滚动查看完整关系。'}点击任务、执行或产物节点打开详情，返回后保留图的位置。</p>`;
}

function fullpanelContent(){let p=state.scope==='all'?null:state.scope,ts=tasksFor(p);if(state.panelTab==='tasks')return taskList(p);if(state.panelTab==='projects')return `<div class="project-grid" style="margin-top:0">${state.projects.filter(pr=>!p||pr.id===p).map(p=>projectCard(p)).join('')}</div>`;if(['runs','reports','artifacts'].includes(state.panelTab))return `<div class="stack">${ts.filter(t=>t.status!=='queued').map(t=>`<button class="panel wide" style="text-align:left" data-action="task" data-id="${t.id}"><div class="spread"><h3>${esc(state.panelTab==='artifacts'?t.artifact:state.panelTab==='runs'?t.run:t.title)}</h3>${badge(state.panelTab==='runs'?runStatus(t):resultStatus(t))}</div><p class="muted" style="font-size:12px;margin-top:10px">${esc(state.panelTab==='runs'?`${t.node} · ${t.model} · ${t.effort}`:t.report)}</p><small style="display:block;margin-top:12px">${esc(project(t.project).title)} · ${esc(t.time)}</small></button>`).join('')}</div>`;if(state.panelTab==='milestones')return `<div class="data-grid">${state.projects.filter(pr=>!p||pr.id===p).map(pr=>`<section class="panel"><div class="eyebrow">${esc(pr.title)}</div><h2>${esc(pr.stage)}</h2><p class="muted" style="font-size:12px">验收：${esc(pr.goal)}</p><div class="progress-row"><div class="progress"><i style="width:45%"></i></div><span>阶段 2 / 3</span></div>${btn('project','进入项目','text-btn',`data-id="${pr.id}"`)}</section>`).join('')}</div>`;if(state.panelTab==='schedules')return `<section class="panel"><div class="spread"><h3>周期计划</h3>${badge(state.schedulePaused?'paused':'enabled')}</div><div class="file-row"><div><strong>每周项目进展整理</strong><small>每周五 · 把运行结果汇总到项目</small></div><button class="btn outline" data-action="schedule">${state.schedulePaused?'恢复计划':'暂停计划'}</button></div><p class="hint">${state.schedulePaused?'计划已在原型里暂停。':'计划已启用（示例）。'}</p></section>`;return `<div class="data-grid">${[['VPS','调度端','在线','理解需求 · 选择执行者'],['MBP','执行端','执行中','代码 · 分析 · 本地工具'],['PMP Desktop','执行端','在线','媒体 · 大文件处理' function render(){const savedGraph=document.querySelector('.graph-stage');const graphScroll=savedGraph&&savedGraph.dataset.projectId===state.graphProject&&savedGraph.dataset.layout===(innerWidth<=760?'phone':'desktop')?{x:savedGraph.scrollLeft,y:savedGraph.scrollTop,pageY:document.querySelector('.page')?.scrollTop||0}:null;document.title=`${state.variant} · ${variantInfo[state.variant].name} · DSH 原型`;let content=state.view==='project-picker'?renderProjectPicker():state.view==='project-detail'?renderProjectDetail():state.view==='projects'?renderProjects():state.view==='conversation'?renderConversation():state.view==='workbench'?renderWorkbench():state.view==='fullpanel'?renderFullpanel():renderHub();document.getElementById('app').innerHTML=`<div id="shell">${rail()}<main>${content}</main></div>`;renderPrototype();renderOverlay();if(graphScroll&&state.graphProject){const stage=document.querySelector('.graph-stage');if(stage){stage.scrollLeft=graphScroll.x;stage.scrollTop=graphScroll.y;document.querySelector('.page').scrollTop=graphScroll.pageY;}}}

function drawer(title,sub,body,footer=''){return `<div class="overlay" data-action="backdrop"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><div><h2>${title}</h2><small>${sub}</small></div><button class="icon-btn" data-action="close" aria-label="关闭详情">${icon('close')}</button></header><div class="modal-body detail-body">${body}</div>${footer?`<footer class="modal-foot">${footer}</footer>`:''}</section></div>`}
function dialog(title,sub,body,footer=''){return `<div class="overlay dialog-wrap" data-action="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><div><h2>${title}</h2><small>${sub}</small></div><button class="icon-btn" data-action="close" aria-label="关闭窗口">${icon('close')}</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-foot">${footer}</footer>`:''}</section></div>`}
function detail(t){return drawer(esc(t.title),`${esc(project(t.project).title)} · ${t.id}`,`${badge(t.status)}<div class="panel"><h3>当前结果</h3><p>${esc(t.report)}</p>${t.status==='running'?'<div class="progress-row"><div class="progress"><i style="width:67%"></i></div><span>8 / 12 案例</span></div>':''}</div><h3>执行与路由</h3><dl class="kv"><dt>执行端</dt><dd>${esc(t.node)}</dd><dt>模型 / 强度</dt><dd>${esc(t.model)} / ${esc(t.effort)}</dd><dt>实际工作区</dt><dd>${esc(project(t.project).workspace)} · ${esc(t.node)}</dd><dt>执行记录</dt><dd>${esc(t.run)} ${badge(runStatus(t))}</dd><dt>最后更新</dt><dd>${esc(t.time)}</dd></dl><div class="line"></div><div class="spread"><h3>报告与产物</h3>${badge(resultStatus(t))}</div><button class="file-row wide" data-action="artifact" data-id="${t.id}" style="text-align:left">${icon('file')}<span style="flex:1"><strong>${esc(t.artifact)}</strong><small>查看报告内容与来源</small></span>${icon('arrow')}</button><div class="line"></div><h3>任务历史</h3><div style="margin-top:18px"><div class="event"><strong>项目统筹创建任务</strong><p>目标与验收要求记录到项目。</p></div><div class="event"><strong>${t.status==='queued'?'等待分配执行':'选择 '+esc(t.node)+' 执行'}</strong><p>${t.status==='queued'?'前置任务完成后开始。':'根据已登记的能力选择模型与工作区。'}</p></div><div class="event status-event" data-status="${t.status}"><strong class="status-text" data-status="${t.status}">${labels[t.status]}</strong><p>${esc(t.report)}</p></div></div><div class="notice neutral" style="margin-top:22px">切换统筹会话不会重建这个任务，也不会打断它的执行。</div>`,`${t.status==='review'?btn('accept','确认通过','fill',`data-id="${t.id}"`):t.status==='running'?btn('simulate-complete','模拟执行完成','outline',`data-id="${t.id}"`):''}${btn(state.variant==='C'?'task-project':'task-chat',state.variant==='C'?'进入所属项目':'到项目对话','outline',`data-id="${t.id}"`)}`)}
function handoff(){let p=current(),ts=tasksFor(p.id);return dialog('整理并继续',`${p.title} · 统筹会话 ${p.session} → ${p.session+1}`,`<div class="notice">审查当前会话并准备下一阶段上下文。新会话成功建立后，才会切换项目入口。</div><section class="handoff-section"><h3>保留到新会话</h3>${[['constraints','项目目标、约束与关键决策',p.goal],['active','正在执行和待处理的任务',`${ts.filter(t=>t.status!=='done').length} 项任务沿用原记录，执行不会中断。`],['next','下一步和未决问题',p.next]].map(([id,title,sub])=>`<label class="handoff-item"><input type="checkbox" data-handoff="${id}" ${state.handoffSelections[id]?'checked':''}><span><strong>${title}</strong><br><span class="muted">${esc(sub)}</span></span></label>`).join('')}</section><section class="handoff-section"><h3>归档为可检索历史</h3><label class="handoff-item"><input type="checkbox" data-handoff="done" ${state.handoffSelections.done?'checked':''}><span>已完成工作、重复讨论和探索过程<br><span class="muted">${count(ts,'done')} 项已完成任务保留结果与证据引用；原会话可随时查看。</span></span></label></section><section class="handoff-section"><h3>交接后</h3><p>工作区仍为 <strong>${esc(p.workspace)}</strong>，当前统筹会话更新为第 ${p.session+1} 个。任务 ID 与执行记录保持连续。</p></section>`,`${btn('handoff-fail','模拟创建失败','outline')}${btn('handoff-confirm','建立新会话并继续','fill')}`)}
function memoryNotes(p){return ({p1:[['手机导航需要全屏切换','项目入口直接打开完整内容区，避免侧栏挤压。','手机验收讨论'],['换会话保留任务身份','通过项目任务引用衔接进度，正在运行的任务继续跟踪。','会话交接设计.md']],p2:[['按当前任务触发记忆','先匹配目标和约束，再加载相关条目。','触发策略.md'],['给注入内容设置预算','保留来源和版本，避免重复注入或无限增长。','上下文预算.md']],p3:[['保留挑战与突破的过程','高光取舍兼顾失败、调整和最终突破。','剪辑原则.md'],['粗剪审核后再推进精剪','确认三处关键取舍，再处理字幕和包装。','本集编辑计划.md']]}[p.id]||[['项目目标',p.goal,'项目描述.md'],['下一步',p.next,'项目计划.md']])}
function renderOverlay(){let o=state.overlay,html='';if(!o){document.getElementById('overlays').innerHTML='';return;}let p=current();if(o.type==='task')html=detail(task(o.id));if(o.type==='tasks')html=drawer('项目任务',p.title,taskList(p.id),btn('fullpanel','进入完整面板','outline'));if(o.type==='handoff')html=handoff();if(o.type==='memory')html=drawer('项目上下文',p.title,`<div class="notice neutral">长期项目资料与当前会话上下文分开保存。按任务加载相关条目，并保留来源。</div><div class="section-label"><h3>始终保留</h3></div><div class="memory-ref"><strong>项目目标与验收要求</strong><p>${esc(p.goal)}</p><small>来源 · 项目描述.md</small></div><div class="memory-ref"><strong>关键决策：优先调度执行端</strong><p>统筹端选择执行者；任务结果以执行报告为准。</p><small>来源 · 关键决策.md · 版本 2</small></div><div class="section-label"><h3>本次相关记忆</h3><span class="badge">2 条</span></div>${memoryNotes(p).map(([title,body,source])=>`<div class="memory-ref"><strong>${esc(title)}</strong><p>${esc(body)}</p><small>来源 · ${esc(source)}</small></div>`).join('')}<p class="hint">此处展示 memory-manager 的预期交互，并未接入实际记忆服务。</p>`,btn('inject-memory','模拟按需注入','fill'));if(o.type==='history')html=drawer('统筹会话历史',p.title,`<div class="notice neutral">点击历史会话可查看交接摘要，项目入口仍指向当前会话。</div>${Array.from({length:p.session},(_,i)=>p.session-i).map(n=>`<div class="archive-row"><div class="spread"><strong>统筹会话 ${n}</strong>${badge(n===p.session?'current':'archived')}</div><p>${n===p.session?'正在统筹当前阶段的工作。':'已保留项目决策、结果证据与交接摘要。'}</p><button class="text-btn" data-action="history-summary" data-id="${n}">查看交接摘要</button></div>`).join('')}`);if(o.type==='artifact'){let t=task(o.id);html=drawer(esc(t.artifact),'任务产物 · 示例内容',`<div class="eyebrow">${esc(t.title)}</div><div class="spread" style="margin-bottom:15px"><h2>执行报告</h2>${badge(resultStatus(t))}</div><p>${esc(t.report)}</p><div class="line"></div><h3>结果证据</h3><p style="margin-top:12px">来自 ${esc(t.node)} 的执行记录 ${esc(t.run)}。报告与任务 ${t.id} 关联。</p><div class="notice neutral" style="margin-top:20px">这是示例报告，用来体验详情、报告与项目对话之间的导航。</div>`)}if(o.type==='create')html=dialog('新建项目','一个项目入口，自动准备工作区与初始统筹会话',`<form id="create-form"><label class="form-field">项目名称<input id="new-title" required placeholder="例如：研究一个新的产品方向"></label><label class="form-field">项目目标<textarea id="new-goal" required placeholder="希望完成什么？有什么要求？"></textarea></label><section class="panel"><h3>创建时自动准备</h3><div class="stack hint"><div>✓ 项目记录与项目描述</div><div>✓ 调度端默认工作区</div><div>✓ 初始统筹会话与项目上下文</div><div>✓ 现有调度工具说明与能力引用</div></div></section></form>`,btn('create-confirm','创建项目','fill'));if(o.type==='project-menu')html=drawer('项目操作',p.title,`<div class="stack">${btn('memory',icon('memory')+' 项目上下文','outline')}${btn('history',icon('clock')+' 历史统筹会话','outline')}${btn('handoff',icon('handoff')+' 整理并继续','outline')}${btn('fullpanel',icon('tasks')+' 完整任务面板','outline')}</div>`);if(o.type==='guide')html=dialog(`${state.variant} · ${variantInfo[state.variant].name}`,'相同数据，三种不同的操作路径',`<p>${variantInfo[state.variant].why}</p><p class="muted" style="font-size:12px;margin-top:14px">${variantInfo[state.variant].guide}</p><div class="line"></div><h3 style="margin-bottom:15px">点击体验</h3><div class="guide-steps">${[['guide-project','进入项目'],['guide-task','审核一个任务'],['guide-handoff','交接到新会话'],['fullpanel','查看完整面板']].map(([a,l])=>btn(a,l,'outline')).join('')}</div><div class="notice neutral">所有操作只修改当前页面内的示例数据。不会调用模型或派发真实任务。刷新即可重置。</div>`);if(o.type==='simple')html=drawer(o.title,'示例 · 原型范围',`<p>${esc(o.text)}</p>`);document.getElementById('overlays').innerHTML=html;}
function notify(text,status='info'){const el=document.getElementById('toast');el.className='toast';el.dataset.status=status;el.textContent=text;el.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.hidden=true,3500)}
function rememberHub(){if(state.variant==='C'&&state.view==='hub')state.hubReturn={scope:state.scope,filter:state.filter};}

function actions(a,id){state.last=({home:'返回主要入口',projects:'打开项目列表',task:'打开任务详情',handoff:'审查会话交接',memory:'查看项目上下文',fullpanel:'进入完整任务面板',accept:'确认示例任务通过',chat:'进入统筹对话'})[a]||a;switch(a){case'variant':switchVariant(id);return;case'prev':case'next':{let ids=['A','B','C'],i=ids.indexOf(state.variant);switchVariant(ids[(i+(a==='next'?1:2))%3]);return}case'home':state.view=state.variant==='C'?'hub':'projects';if(state.variant==='C'&&state.hubReturn){state.scope=state.hubReturn.scope;state.filter=state.hubReturn.filter;}state.overlay=null;break;case'projects':rememberHub();state.view='projects';state.overlay=null;state.search='';break;case'project':openProject(id);break;case'pick-project':state.scopeOrigin=state.view;state.view='project-picker';state.search='';state.overlay=null;break;case'scope-cancel':state.view=state.scopeOrigin;state.search='';break;case'scope-select':state.scope=id;if(id!=='all')state.project=id;state.view=state.scopeOrigin;state.search='';state.last=id==='all'?'已选择全部项目':`已选择项目：${project(id).title}`;break;case'graph-project-info':state.project=id;state.overlay={type:'project-menu'};break;case'chat':state.view=state.variant==='B'?'workbench':'conversation';state.tab='conversation';state.overlay=null;break;case'tab':state.tab=id;state.filter='all';break;case'tab-tasks':state.tab='tasks';break;case'project-tasks':state.overlay={type:'tasks'};state.filter='all';break;case'task':state.overlay={type:'task',id};state.project=task(id).project;break;case'task-project':openProject(task(id).project);break;case'task-chat':openProject(task(id).project);state.view=state.variant==='B'?'workbench':'conversation';state.tab='conversation';break;case'accept':{let t=task(id);t.status='done';t.report='用户已审核并确认通过，结果与证据已保留。';state.last=`${t.title} 已在示例中确认通过`;notify('已确认通过 · 仅修改示例任务','done');break}case'simulate-complete':{let t=task(id);t.status='review';t.report='执行端已完成，结果报告已收到，等待审核。';notify('模拟完成 · 任务转为待确认','review');break}case'filter':state.filter=state.filter===id&&id!=='all'?'all':id;break;case'overview-filter':state.tab='tasks';state.filter=id;break;case'fullpanel':if(state.view==='fullpanel'){state.overlay=null;break;}rememberHub();state.previousView=state.view;state.hubScope=state.scope;state.hubProject=state.project;state.view='fullpanel';state.hubFilter=state.filter;state.scope=state.previousView==='projects'?'all':state.previousView==='hub'?state.scope:state.project;state.panelTab=state.variant==='C'?'projects':'tasks';state.graphProject=state.scope==='all'?null:state.scope;state.filter='all';state.overlay=null;break;case'panel-tab':state.panelTab=id;state.filter='all';break;case'return':state.view=state.previousView||'projects';if(state.view==='hub'){state.filter=state.hubFilter||'all';state.scope=state.hubScope||'all';state.project=state.hubProject||'p1';}state.overlay=null;break;case'memory':case'handoff':case'history':case'create':case'project-menu':case'guide':state.overlay={type:a};break;case'artifact':state.overlay={type:'artifact',id};break;case'close':state.overlay=null;break;case'backdrop':return;case'inject-memory':current().messages.push({role:'assistant',text:`已按当前任务加载两条相关项目记忆：${memoryNotes(current()).map(row=>row[0]).join('、')}。每条记忆都保留来源，后续需要时再加载其他资料。`,memory:true});state.overlay=null;state.view=state.variant==='B'?'workbench':'conversation';state.tab='conversation';state.last='按需注入 2 条项目记忆';notify('已模拟注入 · 2 条相关记忆','success');break;case'handoff-fail':state.last='模拟新会话创建失败 · 当前会话和任务不变';notify('模拟创建失败：仍停留在原会话，任务状态保持不变','error');break;case'handoff-confirm':{let p=current();if(!state.handoffSelections.constraints||!state.handoffSelections.active||!state.handoffSelections.next){notify('交接必须保留项目约束、未完成任务和下一步','warning');return}p.session++;p.context=12;p.messages=[{role:'assistant',text:`已接收上一会话的交接。项目目标：${p.goal} 下一步：${p.next} 未完成任务沿用原记录，我会继续跟踪执行结果。${state.handoffSelections.done?'已完成工作的过程已归档，保留结果和来源引用。':'已完成工作摘要继续保留在本次上下文里。'}`,memory:true}];state.overlay=null;state.view=state.variant==='B'?'workbench':'conversation';state.tab='conversation';state.last=`工作区不变 · 统筹会话更新为 ${p.session} · 任务没有重建`;notify('新统筹会话已建立 · 工作区与任务保持连续','success');break}case'create-confirm':{let title=document.getElementById('new-title').value.trim(),goal=document.getElementById('new-goal').value.trim();if(!title||!goal){notify('请填写项目名称与目标','warning');return}let p={id:'p'+(state.projects.length+1),title,description:goal,goal,next:'和统筹端确认第一阶段的任务与验收要求。',stage:'需求梳理',workspace:'project-'+(state.projects.length+1),session:1,context:4,phase:'新项目',messages:[{role:'assistant',text:`项目“${title}”已准备好。默认工作区、项目描述和初始统筹会话已建立。我们先确认目标：${goal}`} ]};state.projects.push(p);openProject(p.id);state.last='已模拟创建项目、默认工作区和初始会话';notify('项目已创建 · 工作区与统筹会话已准备（模拟）','success');break}case'history-summary':state.overlay={type:'simple',title:`统筹会话 ${id} · 交接摘要`,text:`保留项目目标与关键决策、未完成任务及下一步。已完成工作保留报告引用。当前入口仍是统筹会话 ${current().session}。`};break;case'new-chat':state.overlay={type:'simple',title:'新统筹会话',text:'项目的统筹对话应通过“整理并继续”完成交接。普通新会话保留 DSH 原入口；此原型重点体验项目入口。'};break;case'plugins':state.overlay={type:'simple',title:'插件',text:'沿用 DSH 原生插件页。项目入口作为任务插件提供的全局主页面注册。'};break;case'workspaces':state.overlay= {type:'simple',title:'项目工作区',text:state.projects.map(p=>`${p.title} → ${p.workspace}`).join('；')+'。执行端可以拥有同项目的独立工作区。'};break;case'settings':state.overlay={type:'simple',title:'任务系统设置',text:'模型、连接、角色和执行权限沿用现有任务系统设置；项目页面侧重目标、对话和进展。'};break;case'search':rememberHub();state.view='projects';state.search='';state.overlay=null;break;case'schedule':state.schedulePaused=!state.schedulePaused;state.last=state.schedulePaused?'示例计划已暂停':'示例计划已恢复';notify(state.last,state.schedulePaused?'paused':'enabled');break;case'inspect':state.inspect=!state.inspect;break;case'reset':state.projects=structuredClone(initialProjects);state.tasks=structuredClone(initialTasks);state.project='p1';state.view=state.variant==='A'?'projects':state.variant==='B'?'workbench':'hub';state.overlay=null;state.filter='all';state.scope='all';state.tab='overview';state.graphProject=null;state.hubReturn=null;state.draft='';state.last='重置示例数据';break;case'guide-project':openProject('p1');break;case'guide-task':state.project='p1';state.overlay={type:'task',id:'t2'};break;case'guide-handoff':openProject('p1');state.overlay={type:'handoff'};break;}render();if(a==='search')document.getElementById('project-search')?.focus();}
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='backdrop'){if(ev.target===el){state.overlay=null;renderOverlay();}return;}actions(el.dataset.action,el.dataset.id)});
document.addEventListener('input',ev=>{if(ev.target.id==='message-input')state.draft=ev.target.value;if(ev.target.id==='project-search'){let pos=ev.target.selectionStart;state.search=ev.target.value;render();const field=document.getElementById('project-search');field.focus();field.setSelectionRange(pos,pos)}if(ev.target.dataset.handoff)state.handoffSelections[ev.target.dataset.handoff]=ev.target.checked});
document.addEventListener('change',ev=>{if(ev.target.id==='project-scope'){state.scope=ev.target.value;if(state.scope!=='all')state.project=state.scope;state.filter='all';render()}});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id!=='chat-form')return;let text=state.draft.trim();if(!text)return;let p=current();p.messages.push({role:'user',text});let newTask={id:'t'+(state.tasks.length+1),project:p.id,title:text.length>32?text.slice(0,32)+'…':text,status:'queued',node:'待调度选择',model:'自动选择',effort:'自动',report:'统筹端已记录需求，将根据执行端能力提出路由建议。',artifact:'待生成',time:'刚刚',run:'待创建'};state.tasks.push(newTask);p.messages.push({role:'assistant',text:'已把这项工作加入项目。下一步会选择合适的执行端；你可以点击任务查看它的状态。（此处为模拟交互）',task:newTask.id});p.context=Math.min(95,p.context+3);state.draft='';state.last='模拟消息已发送 · 项目新增 1 个待开始任务';render();let messages=document.getElementById('messages')||document.getElementById('dock-messages');if(messages)messages.scrollTop=messages.scrollHeight});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){state.overlay=null;state.inspect=false;render();return}if(['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName)||ev.target.isContentEditable)return;if(ev.key==='ArrowLeft')actions('prev');if(ev.key==='ArrowRight')actions('next')});
window.addEventListener('resize',()=>{if(state.view==='project-detail')render()});
render();
</script>
